<!-- SHINE APP · DOCKET — App-login/Docket/
     The mobile Docket screen of Docket/docket.html as its own app page: same markup, styles and behaviour —
     "Docket." heading · Action Pending / Action Taken · recruiter invites, job matches and saved jobs by day ·
     Interested / Not interested / Apply / save / share · remove-saved confirmation (shared bottom-sheet component) · expired list · empty states · toast.
     Phone-only (the ≤768px rules are always on). Top bar = shared top-app-bar component (title variant). Bottom tab bar = shared component (Docket active; Home → homepage).
     Not built yet (taps stay here): Job details page, Jobs and Me tabs. -->
<title>Shine — Docket</title>
<link rel="preload" href="fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts/fonts.css"><script src="native.js"></script>

<style>
:root {
    /* ───── CONTENT (text & icons) ───── */
    --content-base: #0D1117;
    --content-muted: #344054;
    --content-faded: #667085;
    --content-disabled: rgba(13, 17, 23, 0.36);
    --content-base-inverse: #FFFFFF;
    --content-on-fill-dark: #FFFFFF;
    --content-on-fill-light: #0D1117;
    --content-brand: #0B3FCC;
    --content-brand-hover: #0A33A6;
    --content-negative: #B42318;
    --content-positive: #027A48;
    --content-notice: #A35A04;
    --content-violet: #6F46E0;
    --content-pink: #BE185D;
    --content-aqua: #0F766A;
    --content-cyan: #0E7490;
    --content-lime: #56770B;
    --content-electric-yellow: #5F5200;  /* electric-yellow/800 — required for AA */

    /* ───── BRAND FONT (lifted from .view-jsrp-d scope so it resolves globally) */
    --font-brand: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    /* ───── STROKE WIDTHS (size.stroke.* from DESIGN-SYSTEM.md §2.4) ─────
       These were referenced throughout JD/JSRP CSS but never defined —
       borders were silently falling back to `medium`=3px. Now matched to
       the DS canonical values (1 / 1.5 / 2). */
    --stroke-thin: 1px;
    --stroke-default: 1.5px;
    --stroke-thick: 2px;
    --stroke-base: #E4E7EC;
    --stroke-muted: #EEF1F5;
    --stroke-faded: #F7F9FB;
    --stroke-disabled: rgba(13, 17, 23, 0.08);
    --stroke-focus: #1A56FF;
    --stroke-negative: #B42318;
    --stroke-positive: #0E9A5A;
    --stroke-notice: #D97706;
    --stroke-violet: #7A5AF8;
    --stroke-pink: #E31B8F;
    --stroke-aqua: #14B8A6;
    --stroke-cyan: #06B6D4;
    --stroke-lime: #8DBF18;
    --stroke-electric-yellow: #E0C500;

    /* ───── SURFACE (backgrounds & fills) ───── */
    --surface-base: #FAF9F6;
    --surface-raised: #FFFFFF;
    --surface-muted: #F7F9FB;
    --surface-sunken: #EEF1F5;
    --surface-hover: #EEF1F5;
    --surface-pressed: #E4E7EC;
    --surface-selected: #F0F5FF;
    --surface-overlay: rgba(13, 17, 23, 0.24);
    --surface-brand-intense: #1A56FF;
    --surface-brand-intense-hover: #0B3FCC;
    --surface-brand-intense-pressed: #0A33A6;
    --surface-brand-subtle: #EBF0FF;
    --surface-negative-intense: #B42318;
    --surface-negative-intense-hover: #8B1A14;
    --surface-negative-subtle: #FEF2F2;
    --surface-positive-intense: #027A48;
    --surface-positive-subtle: #EAFAF0;
    --surface-notice-intense: #FAB663;
    --surface-notice-subtle: #FFF4ED;
    --surface-violet-intense: #6F46E0;
    --surface-violet-subtle: #F3EEFE;
    --surface-pink-intense: #BE185D;
    --surface-pink-subtle: #FCE7F3;
    --surface-aqua-intense: #0F766A;
    --surface-aqua-subtle: #CCFBEE;
    --surface-cyan-intense: #0E7490;
    --surface-cyan-subtle: #CFFAFE;
    --surface-electric-yellow-intense: #FFE419;
    --surface-electric-yellow-subtle: #FFFCC0;
    --surface-lime-intense: #C4FF38;
    --surface-lime-subtle: #EBFFB0;
    /* Note: no --surface-hot-pink-intense — use accent/hot-pink primitive directly */

    /* ───── ACCENT (single-value primitives, no semantic wrapper) ───── */
    --accent-hot-pink: #FF4B8F;
    --accent-orange-deep: #B93815;

    /* ───── EFFECT TOKENS ───── */
    --shadow-raised: 0 1px 3px rgba(13,17,23,.08), 0 1px 2px rgba(13,17,23,.04);
    --shadow-lifted: 0 4px 12px rgba(13,17,23,.08), 0 2px 4px rgba(13,17,23,.04);
    --shadow-sunken: inset 0 1px 2px rgba(13,17,23,.06);

    /* ═══════════════════════════════════════════════════════════════════════ */
    /* LEGACY BRIDGE — existing CSS continues to work, now references semantics */
    /* Do NOT add new code using these; use the semantic tokens above           */
    /* ═══════════════════════════════════════════════════════════════════════ */
    --shine-blue: var(--surface-brand-intense);
    --shine-blue-deep: var(--surface-brand-intense-hover);
    --light-blue-fill: var(--surface-brand-subtle);
    --blue-tint: #F0F4FF;  /* close to blue/50 — kept for back-compat */
    --success-green: #12B76A;  /* green/500 primitive — used in success indicators */
    --green-bg: var(--surface-positive-subtle);
    --green-text: var(--content-positive);
    --warning-amber: #F79009;  /* amber/500 primitive */
    --orange-bg: var(--surface-notice-subtle);
    --orange-text: var(--accent-orange-deep);
    --red: #DC2626;  /* red/500 primitive */
    --yellow-amber: #F59E0B;
    --text-primary: var(--content-base);
    --text-secondary: var(--content-muted);
    --text-muted: var(--content-faded);
    --text-subtle: #98A2B3;  /* cool-neutral/400 primitive */
    --border: var(--stroke-base);
    --hairline: var(--stroke-muted);
    --card-bg: var(--surface-raised);
    --cream: var(--surface-base);
    --dark-bg: var(--content-base);
    --dark-card: var(--surface-inverse-raised);
    --dark-border: var(--stroke-inverse-base);
    --dark-text-muted: var(--content-on-inverse-muted);
    --dark-text-subtle: var(--content-on-inverse-faded);
    --it-bg: var(--surface-brand-subtle);
    --it-ink: var(--surface-brand-intense);
    --bpo-bg: var(--surface-violet-subtle);
    --bpo-ink: #7A5AF8;  /* violet/500 primitive (note: content/violet is violet/600) */
    --bank-bg: #E8F7EF;  /* close to green/100, not a semantic */
    --bank-ink: var(--success-green);
    --insurance-bg: #FEF1E6;  /* close to amber/100, not a semantic */
    --insurance-ink: var(--warning-amber);
    --find-dark-bg: rgba(26,86,255,0.18);
    --find-dark-ink: #7EA3FF;  /* blue/300 primitive */
    --check-dark-bg: rgba(18,183,106,0.18);
    --check-dark-ink: #5DD4A1;  /* green/300 primitive */
    --apply-dark-bg: rgba(247,144,9,0.18);
    --apply-dark-ink: var(--surface-notice-intense);
    --pink-ink: #E31B8F;  /* pink/500 primitive */
    --brut-yellow: var(--surface-electric-yellow-intense);
    --brut-blue: var(--surface-brand-intense);
    --brut-lime: var(--surface-lime-intense);
    --brut-pink: var(--accent-hot-pink);

    /* ═══════════════════════════════════════════════════════════════════════ */
    /* DESIGN SYSTEM v1.0.0 — Primitive + Semantic Tokens                       */
    /* Source of truth: DESIGN-SYSTEM.md (Plus Jakarta Sans, 4px base grid)     */
    /* Names mirror DS dotted paths (e.g. surface.brand.brand-intense) using    */
    /* CSS custom-property kebab-case (--surface-brand-brand-intense).          */
    /* Existing flat tokens above remain as legacy aliases — not removed.       */
    /* ═══════════════════════════════════════════════════════════════════════ */

    /* ── PRIMITIVE · COLOR · Brand / Primary ── */
    --color-brand-primary-50:  #F0F5FF;
    --color-brand-primary-100: #EBF0FF;
    --color-brand-primary-200: #C9DBFF;
    --color-brand-primary-300: #7EA3FF;
    --color-brand-primary-400: #4D7CFF;
    --color-brand-primary-500: #1A56FF;
    --color-brand-primary-600: #0B3FCC;
    --color-brand-primary-700: #0A33A6;
    --color-brand-primary-800: #082478;
    --color-brand-primary-900: #06184F;
    --color-brand-primary-950: #040D2A;

    /* ── PRIMITIVE · COLOR · System / Red ── */
    --color-system-red-50:  #FEF2F2;
    --color-system-red-100: #FEE4E4;
    --color-system-red-200: #FECDCA;
    --color-system-red-300: #FCA5A0;
    --color-system-red-400: #F87171;
    --color-system-red-500: #DC2626;
    --color-system-red-600: #B42318;
    --color-system-red-700: #8B1A14;
    --color-system-red-800: #62110D;
    --color-system-red-900: #380808;
    --color-system-red-950: #1C0404;

    /* ── PRIMITIVE · COLOR · System / Amber ── */
    --color-system-amber-50:  #FFFAF2;
    --color-system-amber-100: #FFF4ED;
    --color-system-amber-200: #FFE0BD;
    --color-system-amber-300: #FFC489;
    --color-system-amber-400: #FAB663;
    --color-system-amber-500: #F79009;
    --color-system-amber-600: #D97706;
    --color-system-amber-700: #A35A04;
    --color-system-amber-800: #6F3D02;
    --color-system-amber-900: #422301;
    --color-system-amber-950: #211100;

    /* ── PRIMITIVE · COLOR · System / Green ── */
    --color-system-green-50:  #EAFAF0;
    --color-system-green-100: #DEF7E5;
    --color-system-green-200: #A8F5C8;
    --color-system-green-300: #5DD4A1;
    --color-system-green-400: #34D77F;
    --color-system-green-500: #12B76A;
    --color-system-green-600: #0E9A5A;
    --color-system-green-700: #027A48;
    --color-system-green-800: #045A36;
    --color-system-green-900: #023320;
    --color-system-green-950: #011A10;

    /* ── PRIMITIVE · COLOR · System / Cool Neutral ── */
    --color-system-cool-neutral-50:  #F7F9FB;
    --color-system-cool-neutral-100: #EEF1F5;
    --color-system-cool-neutral-200: #E4E7EC;
    --color-system-cool-neutral-300: #C8CED7;
    --color-system-cool-neutral-400: #98A2B3;
    --color-system-cool-neutral-500: #667085;
    --color-system-cool-neutral-600: #4A5260;
    --color-system-cool-neutral-700: #344054;
    --color-system-cool-neutral-800: #232A38;
    --color-system-cool-neutral-900: #161B22;
    --color-system-cool-neutral-black: #0D1117;
    --color-system-cool-neutral-white: #FFFFFF;

    /* ── PRIMITIVE · COLOR · System / Warm Neutral ── */
    --color-system-warm-neutral-50:  #FFFDF8;
    --color-system-warm-neutral-100: #FAF9F6;
    --color-system-warm-neutral-200: #F5F1E8;
    --color-system-warm-neutral-300: #E8E5DD;
    --color-system-warm-neutral-400: #D4CCB8;
    --color-system-warm-neutral-500: #A89A7C;
    --color-system-warm-neutral-600: #847459;
    --color-system-warm-neutral-700: #5F4E37;
    --color-system-warm-neutral-800: #3F3324;
    --color-system-warm-neutral-900: #221B12;
    --color-system-warm-neutral-black: #110D08;

    /* ── PRIMITIVE · COLOR · Utility ramps ── */
    --color-utility-pink-500:   #E31B8F;
    --color-utility-violet-500: #7A5AF8;
    --color-utility-aqua-500:   #14B8A6;
    --color-utility-cyan-500:   #06B6D4;
    --color-utility-lime-500:   #8DBF18;
    --color-utility-electric-yellow-500: #E0C500;

    /* ── PRIMITIVE · UNIT (4px base grid) ── */
    --unit-0: 0px;   --unit-1: 1px;   --unit-1-5: 1.5px; --unit-2: 2px;   --unit-3: 3px;
    --unit-4: 4px;   --unit-6: 6px;   --unit-8: 8px;     --unit-10: 10px; --unit-12: 12px;
    --unit-14: 14px; --unit-16: 16px; --unit-18: 18px;   --unit-20: 20px; --unit-22: 22px;
    --unit-24: 24px; --unit-26: 26px; --unit-28: 28px;   --unit-32: 32px; --unit-36: 36px;
    --unit-40: 40px; --unit-44: 44px; --unit-48: 48px;   --unit-56: 56px; --unit-64: 64px;
    --unit-72: 72px; --unit-80: 80px; --unit-88: 88px;   --unit-96: 96px; --unit-104: 104px;
    --unit-120: 120px; --unit-136: 136px; --unit-160: 160px; --unit-240: 240px;
    --unit-320: 320px; --unit-512: 512px; --unit-1024: 1024px;

    /* ── PRIMITIVE · TYPEFACE ── */
    --typeface-family-brand: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --typeface-weight-light: 300;
    --typeface-weight-regular: 400;
    --typeface-weight-medium: 500;
    --typeface-weight-semibold: 600;
    --typeface-weight-bold: 700;
    --typeface-weight-extrabold: 800;

    /* ═══════════════════════════════════════════════════════════════════════ */
    /* SEMANTIC TOKENS — components should consume these                        */
    /* ═══════════════════════════════════════════════════════════════════════ */

    /* ── SEMANTIC · CONTENT ── */
    --content-neutral-base:        var(--color-system-cool-neutral-black);
    --content-neutral-muted:       var(--color-system-cool-neutral-700);
    --content-neutral-faded:       var(--color-system-cool-neutral-500);
    --content-neutral-disabled:    rgba(13, 17, 23, 0.36);
    --content-neutral-brand:       var(--color-brand-primary-600);
    --content-neutral-brand-hover: var(--color-brand-primary-700);
    --content-inverse-base:        var(--color-system-cool-neutral-white);
    --content-inverse-muted:       var(--color-system-cool-neutral-300);
    --content-inverse-faded:       var(--color-system-cool-neutral-400);
    --content-on-fill-dark-base:   var(--color-system-cool-neutral-white);
    --content-on-fill-dark-muted:  var(--color-system-cool-neutral-300);
    --content-on-fill-dark-faded:  var(--color-system-cool-neutral-400);
    --content-on-fill-light-base:  var(--color-system-cool-neutral-black);
    --content-on-fill-light-muted: var(--color-system-cool-neutral-700);
    --content-on-fill-light-faded: var(--color-system-cool-neutral-500);
    --content-status-negative:     var(--color-system-red-600);
    --content-status-positive:     var(--color-system-green-700);
    --content-status-notice:       var(--color-system-amber-700);

    /* ── SEMANTIC · STROKE ── */
    --stroke-neutral-base:     var(--color-system-cool-neutral-200);
    --stroke-neutral-muted:    var(--color-system-cool-neutral-100);
    --stroke-neutral-faded:    var(--color-system-cool-neutral-50);
    --stroke-neutral-disabled: rgba(13, 17, 23, 0.08);
    --stroke-neutral-focus:    var(--color-brand-primary-500);
    --stroke-status-negative:  var(--color-system-red-600);
    --stroke-status-positive:  var(--color-system-green-600);
    --stroke-status-notice:    var(--color-system-amber-600);

    /* ── SEMANTIC · SURFACE ── */
    --surface-neutral-base:    var(--color-system-warm-neutral-100);
    --surface-neutral-raised:  var(--color-system-cool-neutral-white);
    --surface-neutral-muted:   var(--color-system-cool-neutral-100);
    --surface-neutral-sunken:  var(--color-system-cool-neutral-200);
    /* Inverse surfaces — used by the dark site footer and inverse cards.
       Per DESIGN-SYSTEM.md: surface.inverse.base maps to cool-neutral/black. */
    --surface-inverse-base:    var(--color-system-cool-neutral-black);
    --surface-inverse-raised:  var(--color-system-cool-neutral-800);
    --surface-inverse-muted:   var(--color-system-cool-neutral-900);
    --stroke-inverse-base:     var(--color-system-cool-neutral-600);
    --stroke-inverse-muted:    var(--color-system-cool-neutral-700);
    /* Content tokens on inverse (dark) surfaces — legacy aliases used by
       .site-footer (--ft-ink, --ft-muted) and dark sections. */
    --content-on-inverse:        var(--color-system-cool-neutral-white);
    --content-on-inverse-muted:  var(--color-system-cool-neutral-300);
    --content-on-inverse-faded:  var(--color-system-cool-neutral-400);
    --content-brand-on-inverse:  var(--color-brand-primary-300);
    --surface-brand-brand-intense:         var(--color-brand-primary-500);
    --surface-brand-brand-intense-hover:   var(--color-brand-primary-600);
    --surface-brand-brand-intense-pressed: var(--color-brand-primary-700);
    --surface-brand-brand-subtle:          var(--color-brand-primary-100);

    /* ── SEMANTIC · SPACING (mobile defaults; desktop overridden via @media) ── */
    --spacing-inset-none: var(--unit-0);
    --spacing-inset-xs:   var(--unit-4);
    --spacing-inset-sm:   var(--unit-6);
    --spacing-inset-md:   var(--unit-8);
    --spacing-inset-lg:   var(--unit-12);
    --spacing-inset-xl:   var(--unit-16);
    --spacing-inset-xxl:  var(--unit-22);
    --spacing-inline-xs:  var(--unit-2);
    --spacing-inline-sm:  var(--unit-4);
    --spacing-inline-md:  var(--unit-8);
    --spacing-inline-lg:  var(--unit-12);
    --spacing-inline-xl:  var(--unit-18);
    --spacing-stack-3xs:  var(--unit-2);
    --spacing-stack-xxs:  var(--unit-4);
    --spacing-stack-xs:   var(--unit-8);
    --spacing-stack-md:   var(--unit-12);
    --spacing-stack-lg:   var(--unit-14);
    --spacing-stack-xl:   var(--unit-20);
    --spacing-stack-xxl:  var(--unit-24);
    --spacing-section-xs: var(--unit-16);
    --spacing-section-sm: var(--unit-20);
    --spacing-section-md: var(--unit-24);
    --spacing-section-lg: var(--unit-32);
    --spacing-section-xl: var(--unit-48);
    --spacing-layout-xs:  var(--unit-16);
    --spacing-layout-sm:  var(--unit-24);
    --spacing-layout-md:  var(--unit-32);
    --spacing-layout-lg:  var(--unit-48);
    --spacing-layout-xl:  var(--unit-64);

    /* ── SEMANTIC · SIZE (non-responsive) ── */
    --size-stroke-thin:    var(--unit-1);
    --size-stroke-default: var(--unit-1-5);
    --size-stroke-thick:   var(--unit-2);
    --size-radius-none: var(--unit-0);
    --size-radius-xs:   var(--unit-2);
    --size-radius-sm:   var(--unit-4);
    --size-radius-md:   var(--unit-8);
    --size-radius-lg:   var(--unit-12);
    --size-radius-xl:   var(--unit-16);
    --size-radius-2xl:  var(--unit-24);
    --size-radius-3xl:  var(--unit-32);
    --size-radius-4xl:  var(--unit-40);
    --size-radius-full: var(--unit-1024);
    --size-icon-xs:  var(--unit-12);
    --size-icon-sm:  var(--unit-14);
    --size-icon-md:  var(--unit-16);
    --size-icon-lg:  var(--unit-20);
    --size-icon-xl:  var(--unit-24);
    --size-icon-2xl: var(--unit-32);
    --size-icon-3xl: var(--unit-40);

    /* ── SEMANTIC · TYPOGRAPHY (mobile defaults; desktop overridden via @media) ── */
    --type-display-2xl-size: var(--unit-64); --type-display-2xl-line: var(--unit-64); --type-display-2xl-track: -1.6px;
    --type-display-xl-size:  var(--unit-48); --type-display-xl-line:  var(--unit-48); --type-display-xl-track: -1.2px;
    --type-display-lg-size:  var(--unit-40); --type-display-lg-line:  var(--unit-40); --type-display-lg-track: -1px;
    --type-display-md-size:  var(--unit-32); --type-display-md-line:  var(--unit-36); --type-display-md-track: -0.4px;
    --type-display-sm-size:  var(--unit-24); --type-display-sm-line:  var(--unit-28); --type-display-sm-track: -0.3px;
    --type-heading-lg-size:  var(--unit-22); --type-heading-lg-line:  var(--unit-26); --type-heading-lg-track: -0.3px;
    --type-heading-md-size:  var(--unit-18); --type-heading-md-line:  var(--unit-22); --type-heading-md-track: -0.2px;
    --type-heading-sm-size:  var(--unit-16); --type-heading-sm-line:  var(--unit-20); --type-heading-sm-track: 0px;
    --type-body-lg-size: var(--unit-16); --type-body-lg-line: var(--unit-24);
    --type-body-md-size: var(--unit-14); --type-body-md-line: var(--unit-20);
    --type-body-sm-size: var(--unit-12); --type-body-sm-line: var(--unit-18);
    --type-eyebrow-md-size: var(--unit-12); --type-eyebrow-md-line: var(--unit-12); --type-eyebrow-md-track: 1.5px;
    --type-eyebrow-sm-size: var(--unit-10); --type-eyebrow-sm-line: var(--unit-10); --type-eyebrow-sm-track: 1px;

    /* Short radius aliases (canonical: --size-radius-*) — promoted to :root so
       components outside .view-jsrp-d resolve them. Previously these lived
       only inside .view-jsrp-d which was removed when this file was split out. */
    --radius-xs:  2px;
    --radius-sm:  4px;
    --radius-md:  8px;
    --radius-lg:  12px;
    --radius-xl:  16px;
    --radius-2xl: 24px;
    --radius-3xl: 32px;
    --radius-4xl: 40px;
    --radius-full: 9999px;

    /* ───── LABEL TYPOGRAPHY (DESIGN-SYSTEM.md §2.1 — added v1.1) ─────
       Compact UI markers — badges, chips, tags, pills, small action labels.

   navigation bar but still reports that bar as a safe-area inset, so

   native.js).

   stretches to the new tab — the edge on the side it moves towards leads

   segment control. As it lands (90 ms in) the new icon turns over from

  --bs-spacing-section-lg: 32px; --bs-spacing-section-xl: 48px;
  --bs-spacing-layout-sm: 24px;

  /* SIZE — §2.4 */
  --bs-radius-2xl: 24px;     /* size.radius.2xl — sheet top corners (v2.2: 16 → 24, design decision) */
  --bs-radius-lg: 12px;      /* size.radius.lg — buttons               */
  --bs-radius-full: 1024px;
  --bs-stroke-thin: 1px; --bs-stroke-default: 1.5px; --bs-stroke-thick: 2px;
  --bs-icon-xs: 12px; --bs-icon-sm: 14px; --bs-icon-md: 16px;
  --bs-control-sm: 40px;     /* size.control.sm (proposed in A.02) — minimum hit area */
  --bs-control-lg: 48px;     /* size.control.lg (proposed in A.02) — button height    */
  --bs-sheet-handle-w: 40px; --bs-sheet-handle-h: 4px;     /* PROPOSED size.sheet.handle-* (unit/40 · unit/4)  */
  --bs-sheet-close-sm: 28px; --bs-sheet-close-md: 32px;    /* PROPOSED size.sheet.close-*  (unit/28 · unit/32) */
  --bs-badge-pad-y: 4px;     /* unit/4 — A.04 Badge md block padding (v2.5) */
  --bs-badge-dot: 6px;       /* unit/6 — A.04 Badge dot (v2.5)             */

  /* HEADING SIZES (v2.3) — two title sizes, independent of the heading layout.
     Large 24/28 bold = Display / sm on mobile, Heading / lg on desktop (both 24/28 there) → 24 at every width.
     Medium 16/20 bold = Heading / sm (not responsive). */
  --bs-title-lg-size: var(--bs-display-sm-size); --bs-title-lg-lh: var(--bs-display-sm-lh); --bs-title-lg-ls: var(--bs-display-sm-ls);
  --bs-title-md-size: var(--bs-heading-sm-size); --bs-title-md-lh: var(--bs-heading-sm-lh); --bs-title-md-ls: var(--bs-heading-sm-ls);

  /* COMPONENT ALIASES — the sheet's rhythm, each pointing at one semantic token */
  --bs-gutter: var(--bs-spacing-layout-sm);              /* sides                          */
  --bs-handle-top: var(--bs-spacing-inset-lg);           /* sheet edge → handle (v2.4: 8 → 12) */
  --bs-head-pad-top: var(--bs-spacing-inset-xl);         /* handle → heading               */
  --bs-head-pad-bottom: var(--bs-spacing-stack-xxl);     /* title bar → content (v2.6: 20 → 24) */
  --bs-display-pad-top: var(--bs-spacing-inset-xxl);     /* handle → display heading (v2.4: 16 → 22) */
  --bs-display-to-body: var(--bs-spacing-section-lg);    /* display heading → content (v2.6: 24 → 32) */
  --bs-close-offset: var(--bs-spacing-inset-xl);         /* display close from top / right */
  --bs-bottom-gap: var(--bs-spacing-stack-md);           /* buttons · terms · trust        */
  --bs-btn-gap: var(--bs-spacing-stack-xs);              /* between buttons (A.02 stack)   */
  --bs-inline-top: var(--bs-spacing-section-lg);         /* content → inline bottom (v2.6: 24 → 32) */
  --bs-inline-end: var(--bs-spacing-stack-xxl);          /* under the inline bottom (v2.4: 48 → 24) */
  --bs-sticky-pad: var(--bs-spacing-inset-xl);           /* sticky bottom padding          */
  --bs-max-h: 90vh;

  /* bottom inset: device safe area; ignored inside the Android app (see header) */
  --bs-safe: env(safe-area-inset-bottom, 0px);

  /* motion — PROPOSED motion.sheet-* (DS has no motion section yet) */
  --bs-ease: cubic-bezier(.32,.72,0,1);
  --bs-dur-in: 320ms; --bs-dur-out: 260ms; --bs-dur-scrim: 240ms; --bs-dur-kb: 240ms;
  --bs-lift-up: -1px;                                    /* motion.lift.up (proposed in A.02) */
  --bs-blur-overlay: 4px;                                /* PROPOSED effect.blur.overlay      */

  /* stacking — ShineSheet assigns z = --bs-z + 2·depth (+1 for the sheet) */
  --bs-z: 100;
}
html.in-app .bs { --bs-safe: 0px; }

/* desktop breakpoint (≥768px) — responsive tokens per §2.1 / §2.3 */
@media (min-width: 768px) {
  .bs, .bs-scrim {
    --bs-display-sm-size: 32px; --bs-display-sm-lh: 36px; --bs-display-sm-ls: -0.4px;
    --bs-heading-lg-size: 24px; --bs-heading-lg-lh: 28px; --bs-heading-lg-ls: -0.3px;
    --bs-title-lg-size: var(--bs-heading-lg-size); --bs-title-lg-lh: var(--bs-heading-lg-lh); --bs-title-lg-ls: var(--bs-heading-lg-ls);
    --bs-eyebrow-sm-size: 12px; --bs-eyebrow-sm-lh: 12px; --bs-eyebrow-sm-ls: 1.5px;
    --bs-eyebrow-md-size: 14px; --bs-eyebrow-md-lh: 14px; --bs-eyebrow-md-ls: 2px;
    --bs-spacing-inset-md: 10px; --bs-spacing-inset-xl: 20px; --bs-spacing-inset-xxl: 32px; --bs-spacing-inset-lg: 14px;
    --bs-spacing-inline-sm: 6px; --bs-spacing-inline-md: 10px; --bs-spacing-inline-lg: 16px;
    --bs-spacing-stack-3xs: 4px; --bs-spacing-stack-xs: 10px; --bs-spacing-stack-md: 16px;
    --bs-spacing-stack-xl: 32px; --bs-spacing-stack-xxl: 28px;
    --bs-spacing-section-lg: 48px; --bs-spacing-section-xl: 64px; --bs-spacing-layout-sm: 32px;

/* dark mode — DS dark mappings; only when an ancestor sets data-theme="dark" */
[data-theme="dark"] .bs, [data-theme="dark"] .bs-scrim {
  --bs-content-neutral-base: var(--bs-p-cn-50);
  --bs-content-neutral-muted: var(--bs-p-cn-300);
  --bs-content-neutral-faded: var(--bs-p-cn-400);
  --bs-content-neutral-disabled: var(--bs-p-cn-white-75);
  --bs-content-neutral-brand: var(--bs-p-brand-300);
  --bs-content-inverse-base: var(--bs-p-cn-black);
  --bs-content-inverse-muted: var(--bs-p-cn-700);
  --bs-content-inverse-faded: var(--bs-p-cn-500);
  --bs-content-inverse-brand: var(--bs-p-brand-600);
  --bs-content-status-positive: var(--bs-p-green-400);
  --bs-surface-brand-subtle: var(--bs-p-brand-900);
  --bs-elevation-halo-brand: 0 0 0 3px rgba(var(--bs-p-brand-rgb),.30);
  --bs-stroke-neutral-base: var(--bs-p-cn-600);
  --bs-stroke-neutral-muted: var(--bs-p-cn-700);
  --bs-stroke-neutral-disabled: var(--bs-p-cn-white-25);
  --bs-stroke-neutral-focus: var(--bs-p-brand-300);
  --bs-stroke-inverse-base: var(--bs-p-cn-200);
  --bs-stroke-inverse-muted: var(--bs-p-cn-100);
  --bs-surface-neutral-raised: var(--bs-p-cn-800);
  --bs-surface-neutral-muted: var(--bs-p-cn-900);
  --bs-surface-neutral-state-hover: var(--bs-p-cn-700);
  --bs-surface-neutral-state-pressed: var(--bs-p-cn-600);
  --bs-surface-inverse-base: var(--bs-p-wn-100);
  --bs-surface-inverse-raised: var(--bs-p-white);
  --bs-surface-inverse-state-hover: var(--bs-p-cn-100);
  --bs-surface-inverse-state-pressed: var(--bs-p-cn-200);
  --bs-btn-primary-content: var(--bs-content-inverse-base);
  --bs-elevation-neutral-raised: 0 1px 3px rgba(var(--bs-p-shadow),.40), 0 1px 2px rgba(var(--bs-p-shadow),.25);
  --bs-elevation-neutral-lifted: 0 4px 12px rgba(var(--bs-p-shadow),.45), 0 2px 4px rgba(var(--bs-p-shadow),.30);
  --bs-elevation-neutral-modal: 0 24px 60px -12px rgba(var(--bs-p-shadow),.65), 0 6px 16px -6px rgba(var(--bs-p-shadow),.40);
  --bs-elevation-brand-subtle: 0 8px 24px -10px rgba(var(--bs-p-brand-rgb),.30);
  --bs-elevation-brand-raised: 0 6px 14px -4px rgba(var(--bs-p-brand-rgb),.55);
  --bs-elevation-brand-lifted: 0 16px 40px -12px rgba(var(--bs-p-brand-rgb),.50);
  --bs-elevation-focus-default: 0 0 0 4px rgba(var(--bs-p-brand-rgb),.20);
}

/* ── Scrim (one per stack level, created by ShineSheet) ───────────── */
.bs-scrim {
  position: fixed; inset: 0;
  /* colour as an image layer, never background-color: iOS 26 Safari tints the status bar from the
     background-color of a fixed element at the top edge (ignoring its opacity) */
  --bs-scrim-c: var(--bs-surface-neutral-state-overlay);
  background: linear-gradient(var(--bs-scrim-c), var(--bs-scrim-c));
  opacity: 0; pointer-events: none;
  transition: opacity var(--bs-dur-scrim) ease;
  -webkit-tap-highlight-color: transparent;
}
.bs-scrim[hidden] { display: none !important; }
.bs-scrim.is-open { opacity: 1; pointer-events: auto; }
.bs-scrim--strong { --bs-scrim-c: var(--bs-surface-neutral-state-overlay-strong); -webkit-backdrop-filter: blur(var(--bs-blur-overlay)); backdrop-filter: blur(var(--bs-blur-overlay)); }
.bs-scrim--nested { position: absolute; border-radius: var(--bs-radius-2xl) var(--bs-radius-2xl) 0 0; }

/* ── Sheet ─────────────────────────────────────────────────────────── */
.bs {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: calc(var(--bs-z) + 1);
  display: flex; flex-direction: column;
  max-height: var(--bs-max-h); max-height: min(var(--bs-max-h), 90dvh);
  background: var(--bs-surface-neutral-raised); color: var(--bs-content-neutral-base);
  border-radius: var(--bs-radius-2xl) var(--bs-radius-2xl) 0 0;
  box-shadow: var(--bs-elevation-neutral-modal);
  font-family: var(--bs-typeface-brand); -webkit-font-smoothing: antialiased;
  overflow: hidden; outline: none;
  transform: translate3d(0, 100%, 0);
  transition: transform var(--bs-dur-out) var(--bs-ease), padding-bottom var(--bs-dur-kb) var(--bs-ease), max-height var(--bs-dur-kb) var(--bs-ease);
  will-change: transform; touch-action: pan-y;
}
.bs *, .bs *::before, .bs *::after { box-sizing: border-box; }
.bs[hidden] { display: none !important; }
.bs.is-open { transform: translate3d(0, 0, 0); transition-duration: var(--bs-dur-in), var(--bs-dur-kb), var(--bs-dur-kb); }
.bs.is-dragging { transition: none; }

/* inverse (dark surface in light mode) — quick checks, feedback: neutral roles re-pointed at inverse tokens */
.bs.bs--inverse {
  --bs-content-neutral-base: var(--bs-content-inverse-base);
  --bs-content-neutral-muted: var(--bs-content-inverse-muted);
  --bs-content-neutral-faded: var(--bs-content-inverse-faded);
  --bs-content-neutral-brand: var(--bs-content-inverse-brand);
  --bs-stroke-neutral-base: var(--bs-stroke-inverse-base);
  --bs-surface-neutral-muted: var(--bs-surface-inverse-raised);
  --bs-surface-neutral-state-hover: var(--bs-surface-inverse-state-hover);
  --bs-surface-neutral-state-pressed: var(--bs-surface-inverse-state-pressed);
  background: var(--bs-surface-inverse-base); color: var(--bs-content-neutral-base);
  border-top: var(--bs-stroke-thin) solid var(--bs-stroke-inverse-muted);
}

/* nested — a sheet that opens INSIDE another sheet and covers it (e.g. "See all") */
.bs--nested { position: absolute; top: 0; max-height: none; height: 100%; box-shadow: none; transform: translate3d(0, 110%, 0); transition: transform 280ms ease; }
.bs--nested.is-open { transition-duration: 280ms; }

/* ══ 1 · TOP SECTION ══════════════════════════════════════════════════ */
.bs-top {
  flex-shrink: 0; position: relative; z-index: 2;
  display: flex; flex-direction: column;              /* flex keeps the handle's margin from collapsing */
  touch-action: none;                                 /* drag-to-dismiss handle zone */
  transition: box-shadow 160ms ease;
}
.bs-handle {
  flex-shrink: 0;
  width: var(--bs-sheet-handle-w); height: var(--bs-sheet-handle-h);
  margin: var(--bs-handle-top) auto 0;
  border-radius: var(--bs-radius-full);
  background: var(--bs-stroke-neutral-base);
  cursor: grab; touch-action: none;
}
.bs-handle::before { content: ""; display: block; height: 24px; margin: -10px -24px 0; }   /* 88 × 24 drag target */

/* ── Heading LAYOUT (where things sit) and heading SIZE (how big the title is) are separate choices ──
   Layout:  .bs-head            title bar — title + close in one row, 28px close (lists, pickers, forms)
            .bs-head--display   display   — stacked eyebrow · title · sub, 32px close in the corner (confirmations, nudges, OTP)
   Size:    .bs-head--lg        Large  24/28 bold + Body / md sub (content.neutral.muted, 8 above)
            .bs-head--md        Medium 16/20 bold + Body / sm sub (content.neutral.faded, 2 above)
   Defaults: title bar = Medium, display = Large. Add the size class to override either way. */
.bs-head {
  --bs-h-size: var(--bs-title-md-size); --bs-h-lh: var(--bs-title-md-lh); --bs-h-ls: var(--bs-title-md-ls);
  --bs-h-sub-size: var(--bs-body-sm-size); --bs-h-sub-lh: var(--bs-body-sm-lh);
  --bs-h-sub-color: var(--bs-content-neutral-faded); --bs-h-sub-gap: var(--bs-spacing-stack-3xs);
  display: flex; align-items: center; gap: var(--bs-spacing-inline-md);
  padding: var(--bs-head-pad-top) var(--bs-gutter) var(--bs-head-pad-bottom);
}
.bs-head--display, .bs-head.bs-head--lg {
  --bs-h-size: var(--bs-title-lg-size); --bs-h-lh: var(--bs-title-lg-lh); --bs-h-ls: var(--bs-title-lg-ls);
  --bs-h-sub-size: var(--bs-body-md-size); --bs-h-sub-lh: var(--bs-body-md-lh);
  --bs-h-sub-color: var(--bs-content-neutral-muted); --bs-h-sub-gap: var(--bs-spacing-stack-xs);
}
.bs-head.bs-head--md {
  --bs-h-size: var(--bs-title-md-size); --bs-h-lh: var(--bs-title-md-lh); --bs-h-ls: var(--bs-title-md-ls);
  --bs-h-sub-size: var(--bs-body-sm-size); --bs-h-sub-lh: var(--bs-body-sm-lh);
  --bs-h-sub-color: var(--bs-content-neutral-faded); --bs-h-sub-gap: var(--bs-spacing-stack-3xs);
}
.bs-heading { flex: 1; min-width: 0; }
.bs-title {
  margin: 0; color: inherit;
  font: var(--bs-weight-bold) var(--bs-h-size, var(--bs-title-md-size))/var(--bs-h-lh, var(--bs-title-md-lh)) var(--bs-typeface-brand);
  letter-spacing: var(--bs-h-ls, var(--bs-title-md-ls));
}
.bs-title .accent { color: var(--bs-content-neutral-brand); }
.bs-sub {
  margin: var(--bs-h-sub-gap, var(--bs-spacing-stack-3xs)) 0 0;
  font: var(--bs-weight-medium) var(--bs-h-sub-size, var(--bs-body-sm-size))/var(--bs-h-sub-lh, var(--bs-body-sm-lh)) var(--bs-typeface-brand);
  color: var(--bs-h-sub-color, var(--bs-content-neutral-faded));
}
.bs-eyebrow {
  margin: 0 0 var(--bs-eyebrow-sm-para);
  font: var(--bs-weight-bold) var(--bs-eyebrow-sm-size)/var(--bs-eyebrow-sm-lh) var(--bs-typeface-brand);
  letter-spacing: var(--bs-eyebrow-sm-ls); text-transform: uppercase;
  color: var(--bs-content-neutral-brand);
}
/* eyebrow as a badge (v2.5 · share sheet): the eyebrow label (Eyebrow / md, caps) in an A.04 Badge · brand · md
   container — surface.brand.brand-subtle, radius full, 4 / 8 padding — with an optional 6 px dot (static: A.04 keeps
   the pulse for live states) and stack.md 12 to the title. Markup: <p class="bs-eyebrow bs-eyebrow--badge">
   <span class="bs-eyebrow-dot" aria-hidden="true"></span>Share this job</p> */
.bs-eyebrow--badge {
  display: flex; width: max-content; max-width: 100%; align-items: center; gap: var(--bs-spacing-inline-sm);   /* block-level so its margin is exact */
  margin-bottom: var(--bs-spacing-stack-md);
  padding: var(--bs-badge-pad-y) var(--bs-spacing-inset-md);
  border-radius: var(--bs-radius-full);
  background: var(--bs-surface-brand-subtle);
  font-size: var(--bs-eyebrow-md-size); line-height: var(--bs-eyebrow-md-lh); letter-spacing: var(--bs-eyebrow-md-ls);
}
.bs-eyebrow-dot {
  flex: none; width: var(--bs-badge-dot); height: var(--bs-badge-dot); border-radius: var(--bs-radius-full);
  background: currentColor; box-shadow: var(--bs-elevation-halo-brand);
}
.bs-close {
  position: relative; flex-shrink: 0; width: var(--bs-sheet-close-sm); height: var(--bs-sheet-close-sm);
  display: grid; place-items: center; padding: 0;
  border: none; border-radius: var(--bs-radius-full);
  background: var(--bs-surface-neutral-muted); color: var(--bs-content-neutral-muted);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 140ms ease, color 140ms ease;
}
.bs-close::after { content: ""; position: absolute; inset: -6px; }   /* 28 + 2·6 = size.control.sm (40) hit area */
.bs-close svg { width: var(--bs-icon-xs); height: var(--bs-icon-xs); }
.bs-close:active { background: var(--bs-surface-neutral-state-pressed); color: var(--bs-content-neutral-base); }
@media (hover: hover) { .bs-close:hover { background: var(--bs-surface-neutral-state-hover); color: var(--bs-content-neutral-base); } }

/* display layout — stacked heading, inset.xxl above it, close 32px at 16/16, stack.xxl to the content */
.bs-head--display { display: block; position: static; padding: var(--bs-display-pad-top) var(--bs-gutter) var(--bs-display-to-body); }
.bs-head--display .bs-close {
  position: absolute; top: var(--bs-close-offset); right: var(--bs-close-offset);
  width: var(--bs-sheet-close-md); height: var(--bs-sheet-close-md);
}
.bs-head--display .bs-close::after { inset: -4px; }   /* 32 + 2·4 = 40 */
.bs-head--display .bs-close svg { width: var(--bs-icon-sm); height: var(--bs-icon-sm); }
/* keep the heading clear of the close: close + its offset − gutter + inline gap */
.bs-head--display:has(.bs-close) .bs-heading { padding-right: calc(var(--bs-sheet-close-md) + var(--bs-close-offset) - var(--bs-gutter) + var(--bs-spacing-inline-md)); }

/* focus — stroke.neutral.focus outline + elevation.focus.default ring */
.bs :focus-visible:not(.btn) { outline: var(--bs-stroke-thick) solid var(--bs-stroke-neutral-focus); outline-offset: 2px; box-shadow: var(--bs-elevation-focus-default); }   /* atom buttons draw their own focus (v2.7.0) */
.bs:focus-visible { outline: none; box-shadow: var(--bs-elevation-neutral-modal); }   /* the sheet itself takes focus on open: no ring */

/* ══ 2 · BODY ═════════════════════════════════════════════════════════ */
.bs-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.bs-body--gutter { padding-left: var(--bs-gutter); padding-right: var(--bs-gutter); }

/* ══ 3 · BOTTOM SECTION ═══════════════════════════════════════════════
   One per sheet: buttons (.bs-actions) and any of terms (.bs-terms) and a
   trust marker (.bs-trust), in the order written. Where it sits decides how
   it behaves — ShineSheet moves it for data-bs-cta="inline|sticky|auto". */
.bs-bottom {
  flex-shrink: 0; position: relative; z-index: 2;
  display: flex; flex-direction: column; gap: var(--bs-bottom-gap);
  transition: box-shadow 160ms ease;
}
.bs-bottom[hidden] { display: none !important; }
/* sticky: pinned after the body; a Separator (A.11 default) only while more content sits below */
.bs > .bs-bottom { padding: var(--bs-sticky-pad) var(--bs-gutter) max(var(--bs-sticky-pad), var(--bs-safe)); }
.bs.has-more > .bs-bottom { box-shadow: inset 0 var(--bs-stroke-thin) 0 var(--bs-stroke-neutral-muted); }
/* inline: the last thing in the body — stack.xxl above and below; with a home indicator: safe area + inset.xl */
.bs-body > .bs-bottom {
  padding: var(--bs-inline-top) var(--bs-gutter) max(var(--bs-inline-end), calc(var(--bs-safe) + var(--bs-sticky-pad)));
}
.bs-body--gutter > .bs-bottom { padding-left: 0; padding-right: 0; }
.bs-body > .bs-bottom:first-child { padding-top: 0; }   /* nothing above it in the body: the heading's spacing is enough */

/* buttons — the buttons atom (atoms/buttons, A.02), size lg: stacked with spacing.stack.xs, or a row with spacing.inline.lg */
.bs-actions { display: flex; flex-direction: column; gap: var(--bs-btn-gap); }
.bs-actions--row { flex-direction: row; gap: var(--bs-spacing-inline-lg); }   /* v2.7.0: 12 — the buttons atom's side-by-side gap (was inline.md 8) */
.bs-actions--row > * { flex: 1 1 0; min-width: 0; }

/* .bs-btn — DEPRECATED (v2.7.0): App-login sheets use the buttons atom (atoms/buttons: .btn .btn--{type} .btn--lg).
   Kept only for this folder's spec and demo pages until they move; don't use it in a new sheet.
   Button · DS A.02, size lg (control.lg 48 · radius.lg · inset.xxl · Label / lg bold) */
.bs-btn {
  appearance: none; -webkit-appearance: none; margin: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--bs-spacing-inline-md);
  height: var(--bs-control-lg); padding: 0 var(--bs-spacing-inset-xxl); border-radius: var(--bs-radius-lg);
  border: var(--bs-stroke-default) solid transparent;
  font: var(--bs-weight-bold) var(--bs-label-lg-size)/var(--bs-label-lg-lh) var(--bs-typeface-brand);
  letter-spacing: 0; text-decoration: none; white-space: nowrap;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transform: translateY(0);
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
}
.bs-btn svg { width: var(--bs-icon-md); height: var(--bs-icon-md); flex-shrink: 0; }
.bs-btn--primary { background: var(--bs-surface-inverse-base); color: var(--bs-btn-primary-content); }
.bs-btn--brand { background: var(--bs-surface-brand-intense); color: var(--bs-content-on-fill-dark-base); box-shadow: var(--bs-elevation-brand-raised); }
.bs-btn--secondary { background: transparent; color: var(--bs-content-neutral-base); border-color: var(--bs-stroke-neutral-base); }
.bs-btn--ghost { background: transparent; color: var(--bs-content-neutral-faded); padding: 0 var(--bs-spacing-inset-lg); }
.bs-btn--destructive { background: var(--bs-surface-status-negative-intense); color: var(--bs-content-on-fill-dark-base); }
/* pressed (touch + pointer) */
.bs-btn--primary:active { background: var(--bs-surface-inverse-state-pressed); box-shadow: var(--bs-elevation-neutral-raised); }
.bs-btn--brand:active { background: var(--bs-surface-brand-intense-pressed); box-shadow: var(--bs-elevation-brand-subtle); }

<style data-page="share-sheet">
/* Share sheet · body content (page) — the sheet itself is the bottom-sheet component (v2.6.0+).
   Same block on My Jobs and Docket. DS atoms, semantic tokens via the scoped --shs-* layer:
     channels — A.06 Chip · md (44 · 14 semibold · icon 14 · 4 icon gap · 8 apart, wrap)
     link     — A.01 Input · lg, read-only (48 · surface.neutral.muted · 16 text: no iOS zoom)

.shs {
  /* PRIMITIVES — DESIGN-SYSTEM.md §1 (backing values only) */

  --shs-surface-neutral-muted: var(--shs-p-cn-100);          /* link field (read-only)        */
  --shs-surface-neutral-state-hover: var(--shs-p-cn-100);    /* chip pressed (touch feedback) */
  --shs-stroke-neutral-base: var(--shs-p-cn-200);            /* chip border                   */
  --shs-stroke-neutral-focus: var(--shs-p-brand-500);
  --shs-content-neutral-base: var(--shs-p-cn-black);         /* chip hover · X / email marks  */
  --shs-content-neutral-muted: var(--shs-p-cn-700);          /* chip label · link text        */
  --shs-surface-inverse-base: var(--shs-p-cn-black);         /* Copy (Primary · Neutral)      */
  --shs-surface-inverse-state-hover: var(--shs-p-cn-700);
  --shs-surface-inverse-state-pressed: var(--shs-p-cn-600);
  --shs-content-on-fill-dark-base: var(--shs-p-white);
  --shs-mark-linkedin: #0A66C2;  --shs-mark-facebook: #1877F2;  --shs-mark-whatsapp: #25D366;   /* brand marks, not DS */

  /* ELEVATION — §2.5 */
  --shs-elevation-neutral-raised: 0 1px 3px rgba(var(--shs-p-shadow),.08), 0 1px 2px rgba(var(--shs-p-shadow),.04);
  --shs-elevation-neutral-lifted: 0 4px 12px rgba(var(--shs-p-shadow),.08), 0 2px 4px rgba(var(--shs-p-shadow),.04);
  --shs-elevation-focus-default: 0 0 0 4px rgba(var(--shs-p-brand-rgb),.10);

  /* TYPE — §2.1 */
  --shs-font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;   /* typeface.family.brand */
  --shs-label-lg-size: 14px; --shs-label-lg-lh: 14px;    /* Label / lg — chip md        */
  --shs-label-md-size: 12px; --shs-label-md-lh: 12px;    /* Label / md — button sm      */
  --shs-body-lg-size: 16px;  --shs-body-lg-lh: 24px;     /* Body / lg  — input lg (16: no iOS zoom on focus) */

  /* SPACING — §2.3 (mobile) */
  --shs-inline-sm: 4px;      /* spacing.inline.sm — chip icon ↔ label (A.06)   */
  --shs-inline-md: 8px;      /* spacing.inline.md — between chips · Copy icon ↔ label (A.02) */
  --shs-stack-xs: 8px;       /* spacing.stack.xs  — chip rows               */
  --shs-stack-xl: 20px;      /* spacing.stack.xl  — channels → link         */
  --shs-inset-xs: 4px;       /* spacing.inset.xs  — button inside the field */
  --shs-inset-xl: 16px;      /* spacing.inset.xl  — chip md · input lg · button sm padding */

  /* SIZE — §2.4 */
  --shs-control-sm: 40px; --shs-control-md: 44px; --shs-control-lg: 48px;   /* size.control.* (proposed in A.02) */
  --shs-radius-md: 8px; --shs-radius-lg: 12px; --shs-radius-full: 1024px;
  --shs-icon-sm: 14px;       /* size.icon.sm — chip + button sm icons */

  .shs { --shs-inline-sm: 6px; --shs-inline-md: 10px; --shs-stack-xs: 10px; --shs-stack-xl: 32px; --shs-inset-xs: 6px; --shs-inset-xl: 20px; }
}

/* ── channels · A.06 Chip · md ─────────────────────────────────────── */
.shs-channels { display: flex; flex-wrap: wrap; gap: var(--shs-stack-xs) var(--shs-inline-md); margin: 0; padding: 0; list-style: none; }
.shs-chip {
  display: inline-flex; align-items: center; gap: var(--shs-inline-sm);
  height: var(--shs-control-md); padding: 0 var(--shs-inset-xl);
  border: var(--shs-stroke-thin) solid var(--shs-stroke-neutral-base); border-radius: var(--shs-radius-full);
  background: var(--shs-surface-neutral-raised); color: var(--shs-content-neutral-muted);
  font: 600 var(--shs-label-lg-size)/var(--shs-label-lg-lh) var(--shs-font); letter-spacing: 0;

/* ── link · A.01 Input · lg (read-only) + A.02 Button · Primary · Neutral · sm ── */
.shs-link {

<style data-page="day-chip">
/* Docket · day chip (user pick 2026-10-19: "B · Floating chip" from the day-strip samples)
   A small pill centred under the top bar that names the day group you are reading and how many cards it has.
   It appears the moment the first day header ("Today") reaches the top bar and rolls to the next group as you scroll.
   Light only (page build). Values are DS tokens:
     surface  #FFFFFF  surface.neutral.raised          ring  1px #EEF1F5  stroke.neutral.muted
     shadow   elevation.neutral.lifted — 0 4px 12px black@8% + 0 2px 4px black@4% (cool-neutral/black #0D1117)
     text     #344054  content.neutral.muted · Label / md bold 12
     size     24 tall · inline 12 (inset.md) · radius.full 1024 · 8 below the top bar (stack.xs)

   v1.2 (2026-10-19): follows the cards (data-day) now that only "Today" keeps its in-list eyebrow; switches early (35 % line).
   Deviation (documented): the label's line box is 16 px, not Label / md's 12, so descenders in "Yesterday" are not
   clipped by the rolling-label mask (same fix as the tab nudge copy). */
.dkc { --dkc-bg: #FFFFFF; --dkc-ring: #EEF1F5; --dkc-text: #344054;
  --dkc-shadow: 0 4px 12px rgba(13, 17, 23, .08), 0 2px 4px rgba(13, 17, 23, .04);
  --dkc-h: 24px; --dkc-inline: 12px; --dkc-gap: 8px; --dkc-z: 1;    /* inside the top bar (z 80 in the Docket sheet), under bottom sheets (100+) */
  --dkc-ease: cubic-bezier(.2, .8, .2, 1);
  position: absolute; top: 100%; left: 0; right: 0;   /* lives inside the top bar, so it rides along when the menu row slides away (top-app-bar v1.1.0) */
  z-index: var(--dkc-z); height: 0; display: flex; justify-content: center; pointer-events: none;
  opacity: 0; visibility: hidden; transition: opacity 160ms ease, visibility 0s linear 160ms; }
.dkc.on { opacity: 1; visibility: visible; transition: opacity 120ms ease; }
.dkc-chip { margin-top: var(--dkc-gap); height: var(--dkc-h); padding: 0 var(--dkc-inline); border-radius: 1024px;
  display: inline-flex; align-items: center; background: var(--dkc-bg); box-shadow: 0 0 0 1px var(--dkc-ring), var(--dkc-shadow);
  transform: translateY(-4px) scale(.94); transition: transform 200ms var(--dkc-ease); }
.dkc.on .dkc-chip { transform: none; }
.dkc-lbl { position: relative; display: block; overflow: hidden; height: 16px; min-width: 72px; text-align: center;
  font: 700 12px/16px "Plus Jakarta Sans", system-ui, sans-serif; color: var(--dkc-text); }
.dkc-lbl b { display: block; font-weight: inherit; white-space: nowrap; }
.dkc-lbl b.out { position: absolute; left: 0; right: 0; top: 0; animation: dkc-out 220ms ease both; }
.dkc-lbl b.in { animation: dkc-in 220ms var(--dkc-ease) both; }
.dkc-lbl b.out.up { animation-name: dkc-out-up; } .dkc-lbl b.in.up { animation-name: dkc-in-up; }
@keyframes dkc-out { to { transform: translateY(-100%); opacity: 0; } }
@keyframes dkc-in { from { transform: translateY(100%); opacity: 0; } }
@keyframes dkc-out-up { to { transform: translateY(100%); opacity: 0; } }
@keyframes dkc-in-up { from { transform: translateY(-100%); opacity: 0; } }

          <!-- ▼ COMPONENT · segment-control v1.1.0 — verbatim copy of App-login/app-components/segment-control/segment-control.js -->
        <script data-component="segment-control">
/* ═══════════════════════════════════════════════════════════════════════
   SHINE · SEGMENT CONTROL  (app component · App-login)          v1.1.0
   Pair with segment-control.css. Zero dependencies, no build step.
   Implements design-system/component-system.md M.01 Segment Control.

   ▶ BEFORE BUILDING OR CHANGING A SEGMENT: read segment-control-spec.html
     + README.md in this folder.

   Markup — tabs (the segment switches what is shown below it):

     <div class="seg seg--block seg--sm" data-shine-seg role="tablist" aria-label="My Jobs">
       <button class="seg-item is-active" role="tab" aria-selected="true"  data-value="recommended">Recommended</button>
       <button class="seg-item"           role="tab" aria-selected="false" data-value="saved">Saved</button>
       <button class="seg-item"           role="tab" aria-selected="false" data-value="applied">Applied</button>
     </div>

     • Panes: give an option aria-controls="<pane id>" and ShineSegment shows that pane and
       hides the panes of the other options ([hidden]). Without aria-controls, listen to the
       event and render the view yourself.
     • Toggle (no tabs/panes): leave out role="tablist" / role="tab"; ShineSegment then uses
       aria-pressed instead of aria-selected.
     • Exactly one option is selected at all times; if none is marked, the first enabled one is.
     • data-value is the option's value (falls back to its text).

   Behaviour
     • Tap / click selects. Keyboard (tabs): ← → move and select (wrap), Home / End, one tab
       stop (roving tabindex). Toggles: every option is a button in the tab order.
     • Disabled options ([disabled] or aria-disabled="true") are skipped.
     • Motion (v1.1) — STRETCH: ShineSegment inserts one <span class="seg-thumb"> per track and
       adds .seg--glide. On a change it sets data-seg-dir="right" | "left" (towards the new option)
       and moves the thumb's left / right edges; the CSS transitions make the leading edge leap and
       the trailing edge follow. Silent selection, resize and first paint use data-seg-dir="none"
       (instant). A track that is hidden (0 wide) keeps the per-option thumb until it is shown.
     • Event `shine:segment` bubbles from the track on every change:
         detail { value, previous, item, source: 'user' | 'api' }
       It is cancelable — preventDefault() keeps the previous option selected.
       Re-selecting the current option fires `shine:segment-reselect` (e.g. scroll the list to top).

   API (window.ShineSegment)
     ShineSegment.mount(el)                   wire one track (done automatically for [data-shine-seg])
     ShineSegment.init(root?)                 mount every [data-shine-seg] under root (default document)
     ShineSegment.set(elOrSel, value, opts?)  select by value; opts.silent = no event. Returns true if it changed.
     ShineSegment.get(elOrSel)                current value

  <script data-component="sub-view">
/* ═══════════════════════════════════════════════════════════════════════
   SHINE · SUB-VIEW HISTORY  (app component · App-login)         v1.0.0
   A screen inside a tab that opens on top of the tab's list without
   leaving the page — Docket › Expired, My Jobs › Saved › Expired — gets a
   real history step, so the phone's Back (Android button, iPhone swipe,
   browser Back) closes it instead of leaving the tab.

   ▶ Read README.md in this folder before using it.

   Usage (one sub-view at a time per page):
     var sv = ShineSubView.attach(function (name) {   // name = 'expired' | null (the list)
       view = name || 'list'; render();
     });
     sv.open('expired');   // panel tap — pushes a step (same URL), calls fn('expired')
     sv.close();           // on-screen back arrow — history.back(); fn(null) runs on popstate
     sv.current();         // 'expired' | null

   How it stays out of the bottom tab bar's way (ShineTabBar v1.1 keeps the
   stack at Home → one tab and compares the page URL):
     • the step uses the SAME URL (history.state only), so the tab bar still
       recognises the page;
     • tapping any tab while a sub-view is open first unwinds the step
       (history.back), then repeats the tap — the tab bar then navigates as
       usual, so Back from any tab still lands on Home;
     • tapping the current tab just closes the sub-view.
   A reload keeps the step (history.state survives) and reopens the sub-view,
   so Back still behaves the same. Zero dependencies.
   ═══════════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  if (global.ShineSubView) return;
  var KEY = 'shineSubView', fn = null, pendingTab = null;
  function now() { var s = global.history.state; return (s && s[KEY]) || null; }
  function emit() { if (fn) fn(now()); }

  global.addEventListener('popstate', function () {
    emit();
    if (pendingTab && !now()) {                 // unwound for a tab tap → repeat it now
      var id = pendingTab; pendingTab = null;
      var b = global.document.querySelector('[data-shine-tabbar] .stb-tab[data-tab="' + id + '"]');
      if (b) setTimeout(function () { b.click(); }, 0);
    }
  });

  // any tab tap while a sub-view is open: unwind first (the page's own shine:tab listeners still run)
  global.document.addEventListener('shine:tab', function (e) {
    if (!now()) return;
    e.preventDefault();
    if (!e.detail.active) pendingTab = e.detail.tab;
    global.history.back();
  });

  global.ShineSubView = {
    version: '1.0.0',
    attach: function (onChange) {
      fn = onChange;
      if (now()) emit();                        // reload inside a sub-view: reopen it
      return {
        open: function (name) {
          if (now() === name) return;
          var st = {}; var cur = global.history.state;
          if (cur && typeof cur === 'object') for (var k in cur) st[k] = cur[k];
          st[KEY] = name;
          global.history.pushState(st, '');     // same URL — the tab bar still recognises the page
          emit();
        },
        close: function () { if (now()) global.history.back(); else if (fn) fn(null); },
        current: now
      };
    }
  };
})(window);
</script>

    bookmark: S + '<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>',

  };

    o = o || {};

    var inner = (ic ? '<span class="ncard-ic" aria-hidden="true">' + ic + '</span>' : '') +
      '<span class="ncard-tx"><span class="ncard-title">' + esc(o.title) + '</span>' + (o.text ? '<span class="ncard-text">' + esc(o.text) + '</span>' : '') + '</span>' +

    if (!m) return;
    var a = d.action;
    if (a === 'open' || a === 'details'){ if (m.unread){ m.unread = false; render(); } say(a === 'details' ? 'Opening job details' : 'Opens the job'); return; }
    if (a === 'share'){ var co = m.kind === 'note' ? m.org : m.who; openShare({ url: shareUrl(m.h, co), title: m.h, company: co, trigger: d.button }); return; }   // share sheet (page block, bottom-sheet component)
    if (a === 'save'){ m.bookmarked = true; m.unread = false; render(); refocus(m.id); say('Saved to My Jobs'); return; }
    if (a === 'unsave'){ pendingUnsave = m.id; setConfirm(true, d.button, m); return; }   // always asks first (saved job or bookmarked match)
    if (a === 'interested'){ m.done = 'interested'; stamp(m); render(); say('Interest sent to ' + m.who); return; }
    if (a === 'decline')   { m.done = 'declined';   stamp(m); render(); say('Marked not interested'); return; }
    if (a === 'apply'){
      if (d.button && d.button.getAttribute('data-apply') === 'external'){ say('Opening company site…'); return; }
      m.done = 'applied'; stamp(m); render(); say('Applied to ' + m.who); return;
    }
  });
  // the expired nudge at the end of Action Pending opens the Expired page
  sheetList.addEventListener('click', function(e){
    if (!e.target.closest('[data-ncard="expired"]')) return;
    listScroll = sheetList.scrollTop; sub.open('expired');
  });

  // Expired = a sub-view with its own history step (shared sub-view helper): the phone's Back closes it,
  // the list comes back where it was
  var listScroll = 0;
  var sub = ShineSubView.attach(function(name){
    var back = (name !== 'expired' && view === 'expired');
    view = (name === 'expired') ? 'expired' : 'list';
    render();
    sheetList.scrollTop = back ? listScroll : 0;
    syncScrollShadow();
  });

  // Menu (the top bar's .stp-menu, top-app-bar v3.0.0): not built yet — same placeholder on every tab
  document.addEventListener('shine:menu', function(){ say('Opens the menu'); });

  // Action Pending / Action Taken = shared segment control (it paints the options; the page renders the list)
  document.addEventListener('shine:segment', function(e){
    if (!sheet.contains(e.target)) return;
    filter = e.detail.value; view = 'list';
    sheetList.scrollTop = 0;
    render();
  });

  // tapping Docket again (the current tab) does nothing — the scroll-to-top was removed (user, 2026-10-19)
  document.addEventListener('shine:tab', function(e){
    if (e.detail.tab !== 'docket' || !e.detail.active) return;
    e.preventDefault();   // keeps the tab bar's own default (scroll the window to the top) from running
  });

  render();
})();

  
</script>

<script data-page="day-chip">
/* Docket · day chip v1.2 — names the day group you are reading in Action Pending and how many cards it has (Action Taken has no groups, so no chip).
   v1.2 (user, 2026-10-19): the in-list eyebrows are gone except "Today", so the chip follows the cards themselves
   (each card carries data-day). It switches a little early — as soon as the first card of the next group rises past
   the reading line, 35 % down the visible list — so that card already reads as part of its own group.
   Lives inside the top bar (rides along when the menu row slides away). Decorative: aria-hidden, takes no taps. */
(function () {
  'use strict';
  var READ = 0.35;                                        // reading line: share of the visible list under the bar
  var sc = document.getElementById('mrSheetList'), hd = document.querySelector('header.stp');
  if (!sc || !hd) return;
  var chip = document.createElement('div'); chip.className = 'dkc'; chip.setAttribute('aria-hidden', 'true');
  chip.innerHTML = '<span class="dkc-chip"><span class="dkc-lbl"><b></b></span></span>';
  hd.appendChild(chip);                                   // inside the bar: moves with it when the menu row slides away
  var lbl = chip.querySelector('.dkc-lbl'), on = false, lastIdx = -1;
  function cards() { return [].slice.call(sc.querySelectorAll('.jcard[data-day]')).filter(function (c) { return c.offsetParent; }); }
  function swap(text, dir) {                              // the label rolls: down the list → up and out, back up → the reverse
    var b = lbl.querySelector('b:not(.out)'); if (!b || b.textContent === text) return;
    if (!b.textContent || !on) { b.textContent = text; return; }
    lbl.querySelectorAll('b.out').forEach(function (o) { o.remove(); });
    var nb = document.createElement('b'); nb.textContent = text; nb.className = 'in' + (dir < 0 ? ' up' : '');
    b.className = 'out' + (dir < 0 ? ' up' : ''); lbl.appendChild(nb);
    setTimeout(function () { if (b.parentNode) b.remove(); if (nb.parentNode && nb.className.indexOf('in') === 0) nb.className = ''; }, 240);
  }
  function off() { if (on) { on = false; chip.classList.remove('on'); } lastIdx = -1; }
  function update() {
    var cs = cards(); if (!cs.length) return off();
    var bar = hd.getBoundingClientRect().bottom, head = sc.querySelector('.mr-day');
    var first = head && head.offsetParent ? head : cs[0];
    if (first.getBoundingClientRect().top > bar + 14) return off();   // the top of the list hasn't reached the chip's line yet
    var read = bar + (sc.getBoundingClientRect().bottom - bar) * READ, groups = [], cur = 0;
    cs.forEach(function (c) {
      var d = c.getAttribute('data-day'); if (groups[groups.length - 1] !== d) groups.push(d);
      if (c.getBoundingClientRect().top <= read) cur = groups.length - 1;
    });
    var day = groups[cur], n = cs.filter(function (c) { return c.getAttribute('data-day') === day; }).length;
    swap(day + ' · ' + n, cur < lastIdx ? -1 : 1);
    if (!on) { on = true; chip.classList.add('on'); }
    lastIdx = cur;
  }
  sc.addEventListener('scroll', update, { passive: true });
  addEventListener('resize', update);
  hd.addEventListener('transitionend', update);         // the bar settled after hiding / showing its menu row
  new MutationObserver(function () { requestAnimationFrame(update); }).observe(sc, { childList: true, subtree: true });
  update();
})();
</script>
