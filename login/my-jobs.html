<!-- SHINE APP · MY JOBS — App-login/My Jobs/
     The Jobs tab: top bar = shared top-app-bar component (title "My Jobs." + segment slot); Docket-style segment Recommended · Saved · Applied (flat lists, newest first;
     Saved ends with Docket's expired panel → "Expired." view).
     Recommended = matches for the profile + job preferences · Saved = jobs bookmarked anywhere (JSRP, JD, similar jobs)
     · Applied = jobs applied to from any page. Job cards = the App-logout JSRP mobile card (same CSS + markup).
     Shell (header, empty states, toast) = the App-login Docket page; the segment is the shared segment-control component. Unsave asks in the shared bottom sheet.
     Bottom tab bar = shared component (Jobs active). Not built yet (taps stay here): job details, share sheet. -->
<title>Shine — My Jobs</title>
<link rel="preload" href="fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="fonts/fonts.css"><script src="native.js"></script>

<style>
:root {
    /* ───── CONTENT (text & icons) ───── */
    --content-base: #0D1117;
    --content-muted: #344054;
    --content-faded: #667085;
    --content-disabled: rgba(13, 17, 23, 0.36);
    --content-base-inverse: #FFFFFF;
    --content-on-fill-dark: #FFFFFF;
    --content-on-fill-light: #0D1117;
    --content-brand: #0B3FCC;
    --content-brand-hover: #0A33A6;
    --content-negative: #B42318;
    --content-positive: #027A48;
    --content-notice: #A35A04;
    --content-violet: #6F46E0;
    --content-pink: #BE185D;
    --content-aqua: #0F766A;
    --content-cyan: #0E7490;
    --content-lime: #56770B;
    --content-electric-yellow: #5F5200;  /* electric-yellow/800 — required for AA */

    /* ───── BRAND FONT (lifted from .view-jsrp-d scope so it resolves globally) */

    /* ───── STROKE WIDTHS (size.stroke.* from DESIGN-SYSTEM.md §2.4) ─────
       These were referenced throughout JD/JSRP CSS but never defined —
       borders were silently falling back to `medium`=3px. Now matched to
       the DS canonical values (1 / 1.5 / 2). */

    --stroke-default: 1.5px;
    --stroke-thick: 2px;
    --stroke-base: #E4E7EC;
    --stroke-muted: #EEF1F5;
    --stroke-faded: #F7F9FB;
    --stroke-disabled: rgba(13, 17, 23, 0.08);
    --stroke-focus: #1A56FF;
    --stroke-negative: #B42318;
    --stroke-positive: #0E9A5A;
    --stroke-notice: #D97706;
    --stroke-violet: #7A5AF8;
    --stroke-pink: #E31B8F;
    --stroke-aqua: #14B8A6;
    --stroke-cyan: #06B6D4;
    --stroke-lime: #8DBF18;
    --stroke-electric-yellow: #E0C500;

    /* ───── SURFACE (backgrounds & fills) ───── */

    --surface-raised: #FFFFFF;
    --surface-muted: #F7F9FB;
    --surface-sunken: #EEF1F5;

    --surface-brand-intense-hover: #0B3FCC;
    --surface-brand-intense-pressed: #0A33A6;
    --surface-brand-subtle: #EBF0FF;
    --surface-negative-intense: #B42318;
    --surface-negative-intense-hover: #8B1A14;
    --surface-negative-subtle: #FEF2F2;
    --surface-positive-intense: #027A48;
    --surface-positive-subtle: #EAFAF0;
    --surface-notice-intense: #FAB663;
    --surface-notice-subtle: #FFF4ED;
    --surface-violet-intense: #6F46E0;
    --surface-violet-subtle: #F3EEFE;
    --surface-pink-intense: #BE185D;
    --surface-pink-subtle: #FCE7F3;
    --surface-aqua-intense: #0F766A;
    --surface-aqua-subtle: #CCFBEE;
    --surface-cyan-intense: #0E7490;
    --surface-cyan-subtle: #CFFAFE;
    --surface-electric-yellow-intense: #FFE419;
    --surface-electric-yellow-subtle: #FFFCC0;

    /* Note: no --surface-hot-pink-intense — use accent/hot-pink primitive directly */

    /* ───── ACCENT (single-value primitives, no semantic wrapper) ───── */

    --accent-orange-deep: #B93815;

    /* ───── EFFECT TOKENS ───── */

    --shadow-lifted: 0 4px 12px rgba(13,17,23,.08), 0 2px 4px rgba(13,17,23,.04);
    --shadow-sunken: inset 0 1px 2px rgba(13,17,23,.06);

    /* ═══════════════════════════════════════════════════════════════════════ */
    /* LEGACY BRIDGE — existing CSS continues to work, now references semantics */
    /* Do NOT add new code using these; use the semantic tokens above           */
    /* ═══════════════════════════════════════════════════════════════════════ */
    --shine-blue: var(--surface-brand-intense);
    --shine-blue-deep: var(--surface-brand-intense-hover);
    --light-blue-fill: var(--surface-brand-subtle);
    --blue-tint: #F0F4FF;  /* close to blue/50 — kept for back-compat */
    --success-green: #12B76A;  /* green/500 primitive — used in success indicators */
    --green-bg: var(--surface-positive-subtle);
    --green-text: var(--content-positive);
    --warning-amber: #F79009;  /* amber/500 primitive */
    --orange-bg: var(--surface-notice-subtle);
    --orange-text: var(--accent-orange-deep);
    --red: #DC2626;  /* red/500 primitive */
    --yellow-amber: #F59E0B;
    --text-primary: var(--content-base);
    --text-secondary: var(--content-muted);
    --text-muted: var(--content-faded);
    --text-subtle: #98A2B3;  /* cool-neutral/400 primitive */
    --border: var(--stroke-base);
    --hairline: var(--stroke-muted);
    --card-bg: var(--surface-raised);
    --cream: var(--surface-base);

    --bpo-bg: var(--surface-violet-subtle);
    --bpo-ink: #7A5AF8;  /* violet/500 primitive (note: content/violet is violet/600) */

    --insurance-bg: #FEF1E6;  /* close to amber/100, not a semantic */
    --insurance-ink: var(--warning-amber);
    --find-dark-bg: rgba(26,86,255,0.18);

    --check-dark-bg: rgba(18,183,106,0.18);
    --check-dark-ink: #5DD4A1;  /* green/300 primitive */
    --apply-dark-bg: rgba(247,144,9,0.18);
    --apply-dark-ink: var(--surface-notice-intense);
    --pink-ink: #E31B8F;  /* pink/500 primitive */

    --brut-blue: var(--surface-brand-intense);
    --brut-lime: var(--surface-lime-intense);
    --brut-pink: var(--accent-hot-pink);

    /* Names mirror DS dotted paths (e.g. surface.brand.brand-intense) using    */
    /* CSS custom-property kebab-case (--surface-brand-brand-intense).          */
    /* Existing flat tokens above remain as legacy aliases — not removed.       */
    /* ═══════════════════════════════════════════════════════════════════════ */

    /* ── PRIMITIVE · COLOR · Brand / Primary ── */
    --color-brand-primary-50:  #F0F5FF;
    --color-brand-primary-100: #EBF0FF;
    --color-brand-primary-200: #C9DBFF;
    --color-brand-primary-300: #7EA3FF;
    --color-brand-primary-400: #4D7CFF;
    --color-brand-primary-500: #1A56FF;
    --color-brand-primary-600: #0B3FCC;
    --color-brand-primary-700: #0A33A6;
    --color-brand-primary-800: #082478;
    --color-brand-primary-900: #06184F;
    --color-brand-primary-950: #040D2A;

    /* ── PRIMITIVE · COLOR · System / Red ── */
    --color-system-red-50:  #FEF2F2;
    --color-system-red-100: #FEE4E4;
    --color-system-red-200: #FECDCA;
    --color-system-red-300: #FCA5A0;
    --color-system-red-400: #F87171;
    --color-system-red-500: #DC2626;
    --color-system-red-600: #B42318;
    --color-system-red-700: #8B1A14;
    --color-system-red-800: #62110D;
    --color-system-red-900: #380808;
    --color-system-red-950: #1C0404;

    /* ── PRIMITIVE · COLOR · System / Amber ── */
    --color-system-amber-50:  #FFFAF2;
    --color-system-amber-100: #FFF4ED;
    --color-system-amber-200: #FFE0BD;
    --color-system-amber-300: #FFC489;
    --color-system-amber-400: #FAB663;
    --color-system-amber-500: #F79009;
    --color-system-amber-600: #D97706;
    --color-system-amber-700: #A35A04;
    --color-system-amber-800: #6F3D02;
    --color-system-amber-900: #422301;
    --color-system-amber-950: #211100;

    /* ── PRIMITIVE · COLOR · System / Green ── */
    --color-system-green-50:  #EAFAF0;
    --color-system-green-100: #DEF7E5;
    --color-system-green-200: #A8F5C8;
    --color-system-green-300: #5DD4A1;
    --color-system-green-400: #34D77F;
    --color-system-green-500: #12B76A;
    --color-system-green-600: #0E9A5A;
    --color-system-green-700: #027A48;
    --color-system-green-800: #045A36;
    --color-system-green-900: #023320;
    --color-system-green-950: #011A10;

    /* ── PRIMITIVE · COLOR · System / Cool Neutral ── */
    --color-system-cool-neutral-50:  #F7F9FB;
    --color-system-cool-neutral-100: #EEF1F5;
    --color-system-cool-neutral-200: #E4E7EC;
    --color-system-cool-neutral-300: #C8CED7;
    --color-system-cool-neutral-400: #98A2B3;
    --color-system-cool-neutral-500: #667085;
    --color-system-cool-neutral-600: #4A5260;
    --color-system-cool-neutral-700: #344054;
    --color-system-cool-neutral-800: #232A38;
    --color-system-cool-neutral-900: #161B22;
    --color-system-cool-neutral-black: #0D1117;
    --color-system-cool-neutral-white: #FFFFFF;

    /* ── PRIMITIVE · COLOR · System / Warm Neutral ── */
    --color-system-warm-neutral-50:  #FFFDF8;
    --color-system-warm-neutral-100: #FAF9F6;
    --color-system-warm-neutral-200: #F5F1E8;
    --color-system-warm-neutral-300: #E8E5DD;
    --color-system-warm-neutral-400: #D4CCB8;
    --color-system-warm-neutral-500: #A89A7C;
    --color-system-warm-neutral-600: #847459;
    --color-system-warm-neutral-700: #5F4E37;
    --color-system-warm-neutral-800: #3F3324;
    --color-system-warm-neutral-900: #221B12;
    --color-system-warm-neutral-black: #110D08;

    /* ── PRIMITIVE · COLOR · Utility ramps ── */
    --color-utility-pink-500:   #E31B8F;
    --color-utility-violet-500: #7A5AF8;
    --color-utility-aqua-500:   #14B8A6;
    --color-utility-cyan-500:   #06B6D4;
    --color-utility-lime-500:   #8DBF18;
    --color-utility-electric-yellow-500: #E0C500;

    /* ── PRIMITIVE · UNIT (4px base grid) ── */
    --unit-0: 0px;   --unit-1: 1px;   --unit-1-5: 1.5px; --unit-2: 2px;   --unit-3: 3px;
    --unit-4: 4px;   --unit-6: 6px;   --unit-8: 8px;     --unit-10: 10px; --unit-12: 12px;
    --unit-14: 14px; --unit-16: 16px; --unit-18: 18px;   --unit-20: 20px; --unit-22: 22px;
    --unit-24: 24px; --unit-26: 26px; --unit-28: 28px;   --unit-32: 32px; --unit-36: 36px;
    --unit-40: 40px; --unit-44: 44px; --unit-48: 48px;   --unit-56: 56px; --unit-64: 64px;
    --unit-72: 72px; --unit-80: 80px; --unit-88: 88px;   --unit-96: 96px; --unit-104: 104px;
    --unit-120: 120px; --unit-136: 136px; --unit-160: 160px; --unit-240: 240px;
    --unit-320: 320px; --unit-512: 512px; --unit-1024: 1024px;

    /* ── PRIMITIVE · TYPEFACE ── */
    --typeface-family-brand: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --typeface-weight-light: 300;
    --typeface-weight-regular: 400;
    --typeface-weight-medium: 500;
    --typeface-weight-semibold: 600;
    --typeface-weight-bold: 700;
    --typeface-weight-extrabold: 800;

    /* ═══════════════════════════════════════════════════════════════════════ */
    /* SEMANTIC TOKENS — components should consume these                        */
    /* ═══════════════════════════════════════════════════════════════════════ */

    /* ── SEMANTIC · CONTENT ── */
    --content-neutral-base:        var(--color-system-cool-neutral-black);
    --content-neutral-muted:       var(--color-system-cool-neutral-700);
    --content-neutral-faded:       var(--color-system-cool-neutral-500);
    --content-neutral-disabled:    rgba(13, 17, 23, 0.36);
    --content-neutral-brand:       var(--color-brand-primary-600);
    --content-neutral-brand-hover: var(--color-brand-primary-700);
    --content-inverse-base:        var(--color-system-cool-neutral-white);
    --content-inverse-muted:       var(--color-system-cool-neutral-300);
    --content-inverse-faded:       var(--color-system-cool-neutral-400);
    --content-on-fill-dark-base:   var(--color-system-cool-neutral-white);
    --content-on-fill-dark-muted:  var(--color-system-cool-neutral-300);

    --content-status-negative:     var(--color-system-red-600);

    /* ── SEMANTIC · STROKE ── */
    --stroke-neutral-base:     var(--color-system-cool-neutral-200);
    --stroke-neutral-muted:    var(--color-system-cool-neutral-100);
    --stroke-neutral-faded:    var(--color-system-cool-neutral-50);
    --stroke-neutral-disabled: rgba(13, 17, 23, 0.08);
    --stroke-neutral-focus:    var(--color-brand-primary-500);
    --stroke-status-negative:  var(--color-system-red-600);
    --stroke-status-positive:  var(--color-system-green-600);
    --stroke-status-notice:    var(--color-system-amber-600);

    /* ── SEMANTIC · SURFACE ── */
    --surface-neutral-base:    var(--color-system-warm-neutral-100);
    --surface-neutral-raised:  var(--color-system-cool-neutral-white);
    --surface-neutral-muted:   var(--color-system-cool-neutral-100);
    --surface-neutral-sunken:  var(--color-system-cool-neutral-200);
    /* Inverse surfaces — used by the dark site footer and inverse cards.
       Per DESIGN-SYSTEM.md: surface.inverse.base maps to cool-neutral/black. */
    --surface-inverse-base:    var(--color-system-cool-neutral-black);
    --surface-inverse-raised:  var(--color-system-cool-neutral-800);
    --surface-inverse-muted:   var(--color-system-cool-neutral-900);
    --stroke-inverse-base:     var(--color-system-cool-neutral-600);
    --stroke-inverse-muted:    var(--color-system-cool-neutral-700);
    /* Content tokens on inverse (dark) surfaces — legacy aliases used by
       .site-footer (--ft-ink, --ft-muted) and dark sections. */
    --content-on-inverse:        var(--color-system-cool-neutral-white);
    --content-on-inverse-muted:  var(--color-system-cool-neutral-300);
    --content-on-inverse-faded:  var(--color-system-cool-neutral-400);
    --content-brand-on-inverse:  var(--color-brand-primary-300);
    --surface-brand-brand-intense:         var(--color-brand-primary-500);
    --surface-brand-brand-intense-hover:   var(--color-brand-primary-600);
    --surface-brand-brand-intense-pressed: var(--color-brand-primary-700);
    --surface-brand-brand-subtle:          var(--color-brand-primary-100);

    /* ── SEMANTIC · SPACING (mobile defaults; desktop overridden via @media) ── */
    --spacing-inset-none: var(--unit-0);
    --spacing-inset-xs:   var(--unit-4);
    --spacing-inset-sm:   var(--unit-6);
    --spacing-inset-md:   var(--unit-8);
    --spacing-inset-lg:   var(--unit-12);
    --spacing-inset-xl:   var(--unit-16);
    --spacing-inset-xxl:  var(--unit-22);
    --spacing-inline-xs:  var(--unit-2);
    --spacing-inline-sm:  var(--unit-4);
    --spacing-inline-md:  var(--unit-8);
    --spacing-inline-lg:  var(--unit-12);
    --spacing-inline-xl:  var(--unit-18);
    --spacing-stack-3xs:  var(--unit-2);
    --spacing-stack-xxs:  var(--unit-4);
    --spacing-stack-xs:   var(--unit-8);
    --spacing-stack-md:   var(--unit-12);
    --spacing-stack-lg:   var(--unit-14);
    --spacing-stack-xl:   var(--unit-20);
    --spacing-stack-xxl:  var(--unit-24);
    --spacing-section-xs: var(--unit-16);
    --spacing-section-sm: var(--unit-20);
    --spacing-section-md: var(--unit-24);
    --spacing-section-lg: var(--unit-32);
    --spacing-section-xl: var(--unit-48);
    --spacing-layout-xs:  var(--unit-16);
    --spacing-layout-sm:  var(--unit-24);
    --spacing-layout-md:  var(--unit-32);
    --spacing-layout-lg:  var(--unit-48);
    --spacing-layout-xl:  var(--unit-64);

    /* ── SEMANTIC · SIZE (non-responsive) ── */
    --size-stroke-thin:    var(--unit-1);
    --size-stroke-default: var(--unit-1-5);
    --size-stroke-thick:   var(--unit-2);
    --size-radius-none: var(--unit-0);
    --size-radius-xs:   var(--unit-2);
    --size-radius-sm:   var(--unit-4);
    --size-radius-md:   var(--unit-8);
    --size-radius-lg:   var(--unit-12);
    --size-radius-xl:   var(--unit-16);
    --size-radius-2xl:  var(--unit-24);
    --size-radius-3xl:  var(--unit-32);
    --size-radius-4xl:  var(--unit-40);
    --size-radius-full: var(--unit-1024);
    --size-icon-xs:  var(--unit-12);
    --size-icon-sm:  var(--unit-14);
    --size-icon-md:  var(--unit-16);
    --size-icon-lg:  var(--unit-20);
    --size-icon-xl:  var(--unit-24);
    --size-icon-2xl: var(--unit-32);
    --size-icon-3xl: var(--unit-40);

    /* ── SEMANTIC · TYPOGRAPHY (mobile defaults; desktop overridden via @media) ── */
    --type-display-2xl-size: var(--unit-64); --type-display-2xl-line: var(--unit-64); --type-display-2xl-track: -1.6px;
    --type-display-xl-size:  var(--unit-48); --type-display-xl-line:  var(--unit-48); --type-display-xl-track: -1.2px;

       components outside .view-jsrp-d resolve them. Previously these lived

    --radius-xs:  2px;
    --radius-sm:  4px;

    /* ───── LABEL TYPOGRAPHY (DESIGN-SYSTEM.md §2.1 — added v1.1) ─────

/* ═══════════════════════════════════════════════════════════════════════
   SHINE · SEGMENT CONTROL  (app component · App-login)          v1.1.0

   2–4 options, the selected one lifted onto a raised "thumb". It switches

     + README.md in this folder (anatomy, every token, placements, do / don't).

   • DESIGN SYSTEM: implements design-system/component-system.md M.01 Segment
     Control (v1.0) — class API, sizes, shapes, states and token audit. Every
     value is a semantic token of DESIGN-SYSTEM.md (§2.1 type · §2.2 colour ·
     §2.3 spacing · §2.4 size · §2.5 elevation). Primitives live only in the
     token layer and back the semantic tokens; rules use semantic tokens only.
     The only raw values are the DS item heights 32 / 36 / 40.
   • App default = .seg .seg--block .seg--sm (full width, 32px options): the
     same control in a screen header (Docket, My Jobs) and inside a card (Home).

     spacing.inset.sm (labels are centred in equal shares; see .seg--block).
   • Both modes: light by default; dark when [data-theme="dark"] is set on an
     ancestor (DS dark mappings). Both breakpoints: desktop (≥768px) values
     for the responsive spacing tokens.
   • Pair with segment-control.js (ShineSegment). Zero dependencies. Classes `seg`.
   • Motion (v1.1, app decision 2026-10-16 — overrides M.01.6 "the thumb never
     slides" for App-login): STRETCH. One thumb (.seg-thumb, added by
     segment-control.js) moves to the tapped option: its leading edge leaps
     there (170ms), the trailing edge follows (300ms, 70ms later), so the thumb
     stretches across and settles. Labels fade colour (180ms). Instant when the

     Without JS (or while the track is hidden) each option paints its own thumb.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Token layer ───────────────────────────────────────────────────── */
.seg {
  /* PRIMITIVES — DESIGN-SYSTEM.md §1 (backing values only; never used in rules) */

  --seg-p-cn-50: #F7F9FB; --seg-p-cn-100: #EEF1F5; --seg-p-cn-400: #98A2B3; --seg-p-cn-500: #667085;

  --seg-p-brand-rgb: 26,86,255;  /* brand/primary/500 — focus ring              */

  --seg-content-neutral-base: var(--seg-p-cn-black);      /* selected · hover */
  --seg-content-neutral-faded: var(--seg-p-cn-500);       /* rest   */

  --seg-elevation-neutral-subtle: 0 1px 2px rgba(var(--seg-p-shadow),.04);
  --seg-elevation-focus-default: 0 0 0 4px rgba(var(--seg-p-brand-rgb),.10);

  --seg-weight-semibold: 600; --seg-weight-bold: 700;
  --seg-label-md-size: 12px; --seg-label-md-lh: 12px;
  --seg-label-sm-size: 10px; --seg-label-sm-lh: 10px;

  --seg-spacing-inset-sm: 6px;    /* option padding left / right in a block track */
  --seg-spacing-inset-lg: 12px;   /* option padding left / right   */
  --seg-spacing-inline-xs: 2px;   /* between options · before a count */
  --seg-spacing-inline-sm: 4px;   /* icon ↔ label                  */

  /* SIZE — §2.4 */
  --seg-radius-lg: 12px;          /* size.radius.lg   — track    */
  --seg-radius-md: 8px;           /* size.radius.md   — thumb    */
  --seg-radius-full: 1024px;      /* size.radius.full — .seg--pill */

  padding: var(--seg-spacing-inset-xs);

  flex-shrink: 0;

.seg--md .seg-item { height: var(--seg-item-md); }

/* ═══════════════════════════════════════════════════════════════════════
   SHINE · SUB-VIEW HISTORY  (app component · App-login)         v1.0.0
   A screen inside a tab that opens on top of the tab's list without
   leaving the page — Docket › Expired, My Jobs › Saved › Expired — gets a
   real history step, so the phone's Back (Android button, iPhone swipe,
   browser Back) closes it instead of leaving the tab.

   ▶ Read README.md in this folder before using it.

   Usage (one sub-view at a time per page):
     var sv = ShineSubView.attach(function (name) {   // name = 'expired' | null (the list)
       view = name || 'list'; render();
     });
     sv.open('expired');   // panel tap — pushes a step (same URL), calls fn('expired')
     sv.close();           // on-screen back arrow — history.back(); fn(null) runs on popstate
     sv.current();         // 'expired' | null

   How it stays out of the bottom tab bar's way (ShineTabBar v1.1 keeps the
   stack at Home → one tab and compares the page URL):
     • the step uses the SAME URL (history.state only), so the tab bar still
       recognises the page;
     • tapping any tab while a sub-view is open first unwinds the step
       (history.back), then repeats the tap — the tab bar then navigates as
       usual, so Back from any tab still lands on Home;
     • tapping the current tab just closes the sub-view.
   A reload keeps the step (history.state survives) and reopens the sub-view,
   so Back still behaves the same. Zero dependencies.
   ═══════════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  if (global.ShineSubView) return;
  var KEY = 'shineSubView', fn = null, pendingTab = null;
  function now() { var s = global.history.state; return (s && s[KEY]) || null; }
  function emit() { if (fn) fn(now()); }

  global.addEventListener('popstate', function () {
    emit();
    if (pendingTab && !now()) {                 // unwound for a tab tap → repeat it now
      var id = pendingTab; pendingTab = null;
      var b = global.document.querySelector('[data-shine-tabbar] .stb-tab[data-tab="' + id + '"]');
      if (b) setTimeout(function () { b.click(); }, 0);
    }
  });

  // any tab tap while a sub-view is open: unwind first (the page's own shine:tab listeners still run)
  global.document.addEventListener('shine:tab', function (e) {
    if (!now()) return;
    e.preventDefault();
    if (!e.detail.active) pendingTab = e.detail.tab;
    global.history.back();
  });

  global.ShineSubView = {
    version: '1.0.0',
    attach: function (onChange) {
      fn = onChange;
      if (now()) emit();                        // reload inside a sub-view: reopen it
      return {
        open: function (name) {
          if (now() === name) return;
          var st = {}; var cur = global.history.state;
          if (cur && typeof cur === 'object') for (var k in cur) st[k] = cur[k];
          st[KEY] = name;
          global.history.pushState(st, '');     // same URL — the tab bar still recognises the page
          emit();
        },
        close: function () { if (now()) global.history.back(); else if (fn) fn(null); },
        current: now
      };
    }
  };
})(window);
</script>

          // Required-skills row — mirrors desktop's .jd-jc-skills-row content.
          // Renders only if the job has skills; the meta's border-bottom acts
          // as the divider above, and this row owns the border-bottom below
          // (which then separates it from the Share / Save / Apply cluster).
          (skillsHTML ?
            '<div class="jsrp-m-jc-skills-row job-card-skills-row">' +
              '<span class="jsrp-m-jc-skills-label job-card-skills-label">Required:</span>' +
              '<span class="jsrp-m-jc-skills-list job-card-skills-list">' + skillsHTML + '</span>' +
            '</div>' : '') +
          // Bottom row — Share + Save + Apply (canonical landscape pattern)
          '<div class="jsrp-m-jc-actions job-card-bottom">' +
            '<button class="jsrp-m-jc-share job-card-share btn btn--md btn--icon" data-act="share" aria-label="Share">' + icoShare + '</button>' +
            '<button class="jsrp-m-jc-save job-card-save btn btn--md btn--icon" data-act="save" aria-label="Save job" aria-pressed="false">' + icoBookmark + '</button>' +
            applyHTML +
          '</div>' +
        '</article>';
      }


  // ── end verbatim card ──

  var ICO_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';
  var ICO_RIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  var ICO_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  var SAVE_OFF = 'class="jsrp-m-jc-save job-card-save btn btn--md btn--icon" data-act="save" aria-label="Save job" aria-pressed="false"';
  var SAVE_ON  = 'class="jsrp-m-jc-save job-card-save btn btn--md btn--icon is-saved" data-act="save" aria-label="Saved — remove job" aria-pressed="true"';

  function ago(d){
    if (d === 0) return 'Applied today';
    if (d < 7) return 'Applied ' + d + 'd ago';
    return 'Applied ' + Math.floor(d / 7) + 'w ago';
  }
  function cardHTML(j, idx){
    var h = jobCardHTML(j, idx);
    h = h.replace('<article class="jsrp-m-jc job-card job-card--landscape"', '<article class="jsrp-m-jc job-card job-card--landscape" data-id="' + j.id + '"');
    if (j.closed){
      // Expired (read-only): no share / save / apply — the Apply slot says when it closed
      h = h.replace(/<button class="jsrp-m-jc-share[\s\S]*?<\/button>/, '');
      h = h.replace(/<button class="jsrp-m-jc-save[\s\S]*?<\/button>/, '');
      h = h.replace(/<button class="jsrp-m-jc-apply[\s\S]*?<\/button>/,
        '<span class="mj-expired" role="status">' + ICO_CLOCK + 'Expired ' + j.closed + '</span>');
      return h.replace('data-id="' + j.id + '"', 'data-id="' + j.id + '" aria-disabled="true"');
    }
    if (j.appliedDays != null){
      // Applied: only Share stays; the Apply button becomes a status pill
      h = h.replace(/<button class="jsrp-m-jc-save[\s\S]*?<\/button>/, '');
      h = h.replace(/<button class="jsrp-m-jc-apply[\s\S]*?<\/button>/,
        '<span class="mj-applied" role="status">' + ICO_CHECK + ago(j.appliedDays) + '</span>');
    } else if (j.saved){
      h = h.replace(SAVE_OFF, SAVE_ON);
    }
    return h;
  }

  var list  = document.getElementById('mjList');
  var sheet = document.getElementById('mrSheet');
  var tab = 'recommended';
  try { var q = new URLSearchParams(location.search).get('tab'); if (q === 'saved' || q === 'applied') tab = q; } catch (e) {}

  var view = 'list';   // 'list' | 'expired' (Saved › Expired)
  function rows(which){
    if (which === 'recommended') return JOBS.filter(function(j){ return j.rec && j.appliedDays == null; });
    if (which === 'saved')       return JOBS.filter(function(j){ return j.saved && j.appliedDays == null; })   // once applied, a job moves to Applied
                                            .sort(function(a, b){ return a.savedOrder - b.savedOrder; });     // most recently saved first
    return JOBS.filter(function(j){ return j.appliedDays != null; })
               .sort(function(a, b){ return a.appliedDays - b.appliedDays; });                                // most recent application first
  }

  // the panel that closes the Saved list — Docket's expired card, same anatomy and copy pattern
  function expiredPanel(){
    if (!EXPIRED.length) return '';
    return '<button class="mr-exp" data-mj="expired" type="button">' +
      '<span class="mr-exp-ic">' + ICO_CLOCK + '</span>' +
      '<span class="mr-exp-tx"><b>' + EXPIRED.length + ' expired</b>' +
        '<span>Closed after you saved them</span></span>' +
      '<span class="mr-exp-chev">' + ICO_RIGHT + '</span>' +
    '</button>';
  }
  // the Expired view — notice + greyed, read-only cards (Docket's .mr-xnote / .mr-xwrap)
  function expiredHTML(){
    var out = '<div class="mr-xnote">' + ICO_CLOCK +
      '<span>Recruiters close a job once the role is filled. These closed after you saved them.</span></div>' +
      '<div class="mr-xwrap"><div class="mj-list">';
    EXPIRED.forEach(function(j, i){ out += cardHTML(j, i); });
    return out + '</div></div>';
  }

  // empty states — same anatomy as Docket's
  function emptyHTML(which, tail){
    var lead = { recommended: '<h3>Matches<br>on the<br><em>way.</em></h3>',
                 saved:       '<h3>Nothing<br>saved.<br><em>Yet.</em></h3>',
                 applied:     '<h3>No<br>applications.<br><em>Yet.</em></h3>' }[which];
    var body = { recommended: 'Add your skills and job preferences and matching jobs land on this page.',
                 saved:       'Tap the bookmark on any job and it lands on this page.',
                 applied:     'Apply to a job and you can follow it from this page.' }[which];
    return '<div class="mr-empty">' +
      '<div class="mr-empty-tx">' + lead + '</div>' +
      '<div class="mr-empty-rule"></div>' +
      '<div class="mr-empty-tx"><p>' + body + '</p></div>' +
      (tail || '') +
    '</div>';
  }

  // header for the Expired view: back arrow in the menu's slot, title "Expired.", segment out (as Docket)
  function header(){
    var gone = (view === 'expired');
    var back = document.querySelector('.stp .stp-back'), menu = document.querySelector('.stp [data-shine-menu]');
    if (back) back.hidden = !gone;
    if (menu) menu.hidden = gone;
    var segw = document.querySelector('.stp-below'); if (segw) segw.hidden = gone;
    sheet.classList.toggle('is-expired', gone);
    document.getElementById('mrTitleM').textContent = gone ? 'Expired.' : 'My Jobs.';
  }
  function render(){
    header();
    if (view === 'expired'){ list.innerHTML = expiredHTML(); syncScroll(); return; }
    var r = rows(tab), tail = (tab === 'saved') ? expiredPanel() : '';
    if (!r.length){ list.innerHTML = emptyHTML(tab, tail); syncScroll(); return; }
    var out = '<div class="mj-list">';
    r.forEach(function(j, i){ out += cardHTML(j, i); });
    list.innerHTML = out + tail + '</div>';
    syncScroll();
  }
  // Saved › Expired = a sub-view with its own history step (shared sub-view helper): the phone's Back
  // (Android button, iPhone swipe) and the back arrow both close it; Saved comes back where it was
  var listScroll = 0;
  var sv = ShineSubView.attach(function(name){
    var back = (name !== 'expired' && view === 'expired');
    view = (name === 'expired') ? 'expired' : 'list';
    if (view === 'expired' && tab !== 'saved'){ tab = 'saved'; ShineSegment.set('#mjSeg', 'saved', { silent: true }); }  // reload inside Expired
    render();
    list.scrollTop = back ? listScroll : 0;
    syncScroll();
  });

  // the segment is the shared segment-control component: it paints the options, the page renders the list
  function setTab(t){
    tab = t;
    ShineSegment.set('#mjSeg', t, { silent: true });
    list.scrollTop = 0;
    render();
  }
  document.getElementById('mjSeg').addEventListener('shine:segment', function(e){ setTab(e.detail.value); });

  function syncScroll(){ sheet.classList.toggle('is-scrolled', list.scrollTop > 2); if (window.ShineTopBar) ShineTopBar.update(); }
  list.addEventListener('scroll', syncScroll, { passive: true });

  function say(t){ if (typeof showToast === 'function') showToast(t); }
  function find(id){ for (var i = 0; i < JOBS.length; i++) if (JOBS[i].id === id) return JOBS[i]; return null; }

  // ── unsave confirmation (shared bottom sheet) ──
  var pending = null;
  document.addEventListener('shine:sheet-close', function(e){ if (e.target.id === 'mjCf') pending = null; });

  document.addEventListener('click', function(e){
    var cf = e.target.closest('[data-mj]');
    if (cf){
      var what = cf.getAttribute('data-mj');
      if (what === 'expired'){ listScroll = list.scrollTop; sv.open('expired'); return; }
      if (what === 'backlist'){ sv.close(); return; }   // = the phone's Back
      if (what === 'cfyes' && pending){
        var pj = find(pending); if (pj) pj.saved = false;
        ShineSheet.close('#mjCf', 'close-button'); render(); say('Removed from saved');
      } else if (what === 'cfno'){ ShineSheet.close('#mjCf', 'close-button'); }
      return;
    }

    var card = e.target.closest('.jsrp-m-jc[data-id]');
    if (!card || !list.contains(card)) return;
    var j = find(card.getAttribute('data-id'));
    if (!j) return;                                   // expired cards are read-only
    var act = e.target.closest('[data-act]');
    if (act){
      var a = act.getAttribute('data-act');
      if (a === 'share'){ say('Link copied'); return; }
      if (a === 'save'){
        if (j.saved){ pending = j.id; ShineSheet.open('#mjCf', { trigger: act }); return; }
        // stays where it is (Recommended keeps it, bookmark filled) and goes to the top of Saved
        j.saved = true; j.savedGroup = 'Saved today'; j.savedOrder = --saveSeq;
        act.classList.add('is-saved'); act.setAttribute('aria-pressed', 'true'); act.setAttribute('aria-label', 'Saved — remove job');
        say('Job saved. Find it in Saved'); return;
      }
      if (a === 'apply'){
        if (act.getAttribute('data-apply') === 'external'){ say('Opening company site…'); return; }
        j.appliedDays = 0; render(); say('Applied to ' + j.co); return;
      }
      return;
    }
    say('Opens job detail');
  });

  // Menu (shared menu-button): not built yet — same placeholder on every tab
  document.addEventListener('shine:menu', function(){ say('Opens the menu'); });

  // tapping Jobs again (the current tab) scrolls the list back to the top
  document.addEventListener('shine:tab', function(e){
    if (e.detail.tab !== 'jobs' || !e.detail.active) return;
    e.preventDefault();
    // (in the Expired view the sub-view helper unwinds first — tapping Jobs there returns to Saved)
    list.scrollTo({ top: 0, behavior: 'smooth' });
  });

  if (view === 'expired') render(); else setTab(tab);
})();
  </script>
</body>
</html>
